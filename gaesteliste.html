<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17181C">
<title>AMK Live 2026 · Gästeliste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --case:#17181C; --panel:#1F2126; --panel2:#26282E; --line:#33363E;
  --ink:#F2F3F6; --dim:#D6DAE3; --tape:#FFD23F; --now:#FF4B3E; --ok:#64A85C;
  --kat-guest:#64A85C; --kat-aaa:#FFD23F; --kat-working:#4098D7; --kat-photo:#C25CA8; --kat-aftershow:#8B93A1;
  --rowhover:#2A2D34;
  --disp:'Archivo Black',sans-serif;
  --body:'Barlow Semi Condensed',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --zoom:1;
  --tape-ink:#FFD23F;   /* Gelb als Textfarbe — nur auf dunklem Grund, siehe unten */
  --tape-sig:#FFD23F;   /* Signalfarbe fuer Zahlen/Hinweise, die sich abheben muessen */
  --amp-offen:#8B93A1;  /* Statuspunkt "angefragt" — eine Flaeche, keine Schrift */
  --ok-ink:#BFE6B8;     /* Gruen und Rot als Schrift — im Hell-Theme dunkler, siehe unten */
  --now-ink:#FFB4AD;
}
/* F4.2 Light-Theme — zweiter Variablensatz, Default bleibt Dark/unveraendert */
:root[data-theme="light"]{
  --case:#F4F3EF; --panel:#FFFFFF; --panel2:#ECEAE3; --line:#D8D5CC;
  --ink:#141518; --dim:#141518;   /* P2: kein Grau — auf hellem Grund schwarzer Text */
  --rowhover:#E3EDF7;
  /* P4: Gelb/Oliv ist auf hellem Grund nie Textfarbe. Ueberschriften schwarz,
     Signalwerte in kraeftigem Braunorange statt Olivgelb. */
  --tape-ink:#141518;
  --tape-sig:#A24B00;
  --ok-ink:#1F6B2E;
  --now-ink:#A32017;
}
*{box-sizing:border-box;margin:0;padding:0}
/* F4.3 Schriftgroesse S/M/L (root 15/16/18px) — als Seiten-Zoom, da Groessen im Formular ueberwiegend in px stehen */
html{zoom:var(--zoom,1)}
html{-webkit-text-size-adjust:100%}
body{background:var(--case);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:90px}

/* ---------- Kopf ---------- */
header{background:var(--panel);border-bottom:3px solid var(--tape);padding:12px 16px 10px;position:relative}
.hdrgear{position:absolute;top:10px;right:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--tape-ink);font-size:18px;line-height:1;padding:7px 9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* F3.1 Icon-Sprite */
.icon{width:18px;height:18px;flex:0 0 auto;display:block}
.tabicon{width:15px;height:15px;flex:0 0 auto}
.tlbicon{width:15px;height:15px;flex:0 0 auto;vertical-align:-3px;margin-right:5px}
/* F1.7 Erklär-Tooltip */
.tipbtn{width:16px;height:16px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:12px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:help;margin-left:5px;padding:0;flex:0 0 auto;vertical-align:1px}
.kicker{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--tape-ink);text-transform:uppercase}
h1{font-family:var(--disp);font-size:clamp(18px,4.5vw,26px);letter-spacing:.01em;margin:2px 0 2px;text-transform:uppercase}
/* Am schmalen Handy sonst läuft der Titel unter den Einstellungen-Knopf. */
@media (max-width:560px){header{padding-right:58px}}
.sub{font-size:14px;color:var(--dim)}
.backbtn{background:none;border:1px solid var(--line);border-radius:4px;color:var(--tape-ink);font-family:var(--mono);font-size:13px;padding:5px 10px;cursor:pointer;margin-bottom:8px}

/* ---------- Tabs ---------- */
.tabs{display:flex;margin:14px 16px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--panel);border:none;color:var(--dim);font-family:var(--disp);font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding:11px 2px;cursor:pointer}
.tabs button.active{background:var(--tape);color:#161616}
.tabs button+button{border-left:1px solid var(--line)}
@media (max-width:560px){.tabs button{font-size:11px;letter-spacing:0;padding:11px 1px;gap:3px}}

/* ---------- Karten / Blöcke ---------- */
.sec{margin:14px 16px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 16px 6px}
.sechead h2{font-family:var(--disp);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.sechead span{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 12px;margin-bottom:8px}
.card.hl{border-color:var(--tape);box-shadow:0 0 0 1px var(--tape)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;padding:2px 6px;display:inline-block}
.badge{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;padding:2px 5px;font-weight:700;display:inline-block}
.b-plan{background:var(--panel2);color:var(--dim)} .b-ok{background:var(--ok);color:#161616}
.b-warn{background:var(--now);color:#fff} .b-tape{background:var(--tape);color:#161616}
.b-final{background:var(--tape);color:#161616} .b-abg{background:#5a2b28;color:#ffb4ad}

/* Statusampel (Einladen) */
.amp{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 auto}
.amp-angefragt{background:var(--amp-offen)} .amp-genehmigt{background:var(--ok)}
.amp-abgelehnt{background:var(--now)} .amp-final{background:var(--tape)}

.hint{margin:10px 16px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:8px}
.hint.warn{border-left-color:var(--now);color:#ffb9b2}
.hint.tape{border-left-color:var(--tape);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tape);border-radius:5px;padding:10px 12px}
.hint.close{position:relative;padding-right:26px}
.hint .x{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer}
.muted{color:var(--dim)}
.mono{font-family:var(--mono)}
.small{font-size:13px}

/* ---------- Fortschrittsbalken ---------- */
.pg{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 8px}
.pg .n{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pg .b{height:6px;background:var(--panel2);border-radius:3px;margin-top:5px;overflow:hidden}
.pg .b i{display:block;height:100%;background:var(--ok)}
.pg .b i.over{background:var(--now)}
.pg .v{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:3px}
.pggrid{margin:10px 16px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.minib{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:3px}
.minib i{display:block;height:100%;background:var(--ok)} .minib i.over{background:var(--now)}

/* ---------- Matrix-Tabelle ---------- */
.tlwrap{margin:10px 16px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:6px}
table.mx{border-collapse:collapse;min-width:100%;font-size:14px}
table.mx th,table.mx td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
table.mx th{background:var(--panel2);font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap;position:sticky;top:0}
table.mx td.grp{font-weight:700;cursor:pointer;white-space:nowrap;background:var(--panel)}
table.mx td.sub{padding-left:18px;color:var(--dim);cursor:pointer;background:var(--panel)}
table.mx td.cell{font-family:var(--mono);cursor:pointer;min-width:96px}
table.mx td.cell .qv{font-size:13px;line-height:1.35;font-weight:700;white-space:nowrap}
table.mx td.cell .qv2{font-weight:400}
table.mx td.cell{min-width:210px}
table.mx tr.grprow{background:var(--panel)}

/* ---------- Gästetabelle (Aufbau und Optik wie das bisherige Tabellenblatt) ---------- */
.gtwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table.gt{border-collapse:separate;border-spacing:0;min-width:100%;font-size:14px;line-height:1.25}
table.gt th,table.gt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;white-space:nowrap;vertical-align:middle}
table.gt th:last-child,table.gt td:last-child{border-right:none}
table.gt thead th{background:var(--panel2);font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:700;position:sticky;top:0;z-index:2;border-bottom:2px solid var(--line)}
table.gt th.num,table.gt td.num{text-align:center}
table.gt td.zahlspalte{padding:1px 2px;min-width:46px}
table.gt td.zahlspalte input{width:100%;min-width:40px;background:transparent;border:1px solid transparent;border-radius:3px;color:var(--ink);font-family:var(--mono);font-weight:700;font-size:14px;padding:3px 2px;text-align:center;-moz-appearance:textfield}
table.gt td.zahlspalte input::-webkit-outer-spin-button,table.gt td.zahlspalte input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.gt td.zahlspalte input:hover{border-color:var(--line)}
table.gt td.zahlspalte input:focus{border-color:var(--tape);background:var(--panel2);outline:none}
table.gt td.name{font-weight:700}
table.gt td.mailzelle,table.gt td.notizzelle{max-width:190px;overflow:hidden;text-overflow:ellipsis}
table.gt tbody tr:nth-child(even){background:var(--panel2)}
table.gt tbody tr:hover{background:var(--rowhover)}
table.gt tbody tr.abgelehnt td{opacity:.5;text-decoration:line-through}
table.gt tbody tr.dublette td.name{color:var(--now)}
table.gt td.num.da{color:var(--ok);font-weight:700}
table.gt td.num.teil{color:var(--tape-sig);font-weight:700}
table.gt tr.gtsum td{background:var(--panel);font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink);position:sticky;top:24px;z-index:1;border-bottom:2px solid var(--line)}
.sorttrenn{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);align-self:center;margin-left:8px}

/* ---------- Kopfblock der Show (Aufbau wie der Kopf der bisherigen Tabelle) ---------- */
.kopfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;align-items:start}
.kopfbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 11px}
.kopftitel{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:2px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.kopfbox .f{margin-bottom:7px}
/* Beide Kapazitaets-Beschriftungen halten zwei Zeilen frei, damit die Felder
   nebeneinander auf gleicher Hoehe stehen, auch wenn nur eine umbricht. */
.f label.kaplabel{min-height:2.5em}
.kapzeile{display:flex;gap:6px;align-items:stretch}
.kapzeile input{flex:1;min-width:0}
.kapist{font-family:var(--mono);font-size:14px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 9px;min-width:44px;text-align:center;color:var(--ok)}
.kapist.ueber{color:#fff;background:var(--now);border-color:var(--now)}
.kontaktzeile{display:grid;grid-template-columns:1fr 118px;gap:4px;margin-bottom:7px}
/* P9: die ausgeschriebene Rolle steht als eigene Zeile ueber Name und Mobilnummer. */
.kontaktzeile .krolle{grid-column:1/-1}
.kontaktzeile input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-family:var(--body);font-size:14px;padding:6px 7px}
.kontaktzeile .krolle{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--dim)}
.kontaktzeile .kmobil{font-family:var(--mono);font-size:13px}
table.zahltab{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:6px}
table.zahltab td{padding:3px 4px;border-bottom:1px solid var(--line)}
table.zahltab td.zahl{text-align:right;font-family:var(--mono);font-weight:700;white-space:nowrap}
table.zahltab td.zahl.ueber{color:var(--now)}
table.zahltab input.vjlabel{width:100%;background:none;border:none;color:var(--ink);font-family:var(--body);font-size:14px;padding:1px 2px}
table.zahltab input.vjwert{width:72px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--ink);font-family:var(--mono);font-weight:700;font-size:14px;padding:3px 5px;text-align:right}
input.vjtitel{background:none;border:none;color:var(--dim);font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;width:100%;padding:0}
table.pooltab{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:8px}
table.pooltab th{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:right;padding:2px 4px;border-bottom:1px solid var(--line)}
table.pooltab th:nth-child(2){text-align:left}
table.pooltab td{padding:3px 4px;border-bottom:1px solid var(--line)}
table.pooltab td.zahl{text-align:right;font-family:var(--mono);white-space:nowrap}
table.pooltab td.zahl.ueber{color:var(--now);font-weight:700}
table.pooltab td.poolname{text-align:left}
table.pooltab tbody tr{cursor:pointer}
table.pooltab tbody tr:hover{background:var(--panel2)}
table.pooltab tr.summe td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
/* Mengenfelder im Gast-Dialog (Spalten Steh/Sitz/… der Tabelle) */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px}
.mcell{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 6px;text-align:center}
.mcell .ml{display:block;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.mcell input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-family:var(--mono);font-weight:700;font-size:16px;padding:5px 4px;text-align:center}
.sumline{font-family:var(--mono);font-size:13px;color:var(--tape-sig);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin-bottom:10px}
.sumline.warn{color:#fff;background:var(--now);border-color:var(--now)}

/* ---------- Formularfelder / Dialog ---------- */
.f{margin-bottom:10px}
.f label{display:block;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-family:var(--body);font-size:15px;padding:8px 9px}
.f textarea{resize:vertical;min-height:52px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--tape);outline-offset:1px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;color:var(--ink);font-family:var(--mono);font-weight:700;font-size:15px;padding:9px 2px;cursor:pointer}
.seg button.on{background:var(--tape);color:#161616;border-color:var(--tape)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:4px;color:var(--tape-ink);font-size:13px;padding:5px 9px;cursor:pointer}
.smallbtn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-size:13px;padding:5px 9px;cursor:pointer}
.smallbtn.ok{border-color:var(--ok);color:var(--ok-ink)} .smallbtn.no{border-color:var(--now);color:var(--now-ink)}
.smallbtn:disabled,.toolbar button:disabled{opacity:.4;cursor:not-allowed}
/* Am Handy/Tablet größere Tippflächen für die kleinen Knöpfe — am Rechner bleibt die Optik unverändert. */
@media (pointer:coarse){
  .smallbtn,.linkbtn{min-height:40px;padding:8px 12px}
  .filterchips button,.glchips button{min-height:36px;padding:8px 13px}
  .glbar .glsearch .glx{font-size:22px;padding:6px 8px}
  /* Die kleinen „?"-Erklärzeichen bleiben optisch gleich, bekommen aber eine
     unsichtbar vergrößerte Tippfläche — sonst trifft man sie am Handy kaum. */
  .tipbtn{position:relative}
  .tipbtn::after{content:'';position:absolute;top:-12px;right:-12px;bottom:-12px;left:-12px}
  /* Sortier- und Ansichtsleiste der Gästeliste — am Rechner unverändert, am Finger größer. */
  .glsort button{min-height:36px;padding:8px 12px}
  /* Mengenfelder der Tabelle: am Handy braucht die Zahl eine ordentliche Trefferfläche. */
  table.gt td.zahlspalte input{min-height:34px;font-size:15px}
  table.gt td.zahlspalte{min-width:52px}
  /* Kopfblock: Kontaktzeilen und Vorjahresfelder ebenfalls auf Fingergröße. */
  .kontaktzeile input{min-height:34px}
  table.zahltab input.vjlabel{min-height:34px;font-size:14px}
  table.zahltab input.vjwert{min-height:34px;font-size:14px}
  input.vjtitel{min-height:30px}
}
/* F4.5 Einfach-Modus — rein visuelle Ausblendung */
body.mode-einfach .einfach-hide{display:none!important}
/* F2.4 Bulk-Auswahl */
.glbulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.glbulk .bkinfo{font-size:13px;color:var(--dim);margin-right:auto}
.glcb{flex:0 0 auto;width:20px;height:20px;margin-right:2px}
/* F2.6 Shortcut-Hilfe */
.schelp{list-style:none;margin:4px 0 0}
.schelp li{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.schelp kbd{font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;min-width:34px;text-align:center;color:var(--tape-ink)}
/* F2.5 Begleitungs-Treffer */
.compbtn.qhit{border-color:var(--tape);box-shadow:0 0 0 2px var(--tape) inset}
.elhitcount{font-size:13px;color:var(--tape-sig);font-family:var(--mono);margin:0 16px 6px}
/* F5.1/F6.8 QR */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.qrbox .qrframe{background:#fff;padding:12px;border-radius:8px;line-height:0}
.qrbox .qrframe svg{display:block;width:220px;height:220px}
.qrbox .qrlink{font-family:var(--mono);font-size:13px;color:var(--dim);word-break:break-all;text-align:center}

dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--tape);border-radius:8px;padding:16px;width:min(460px,93vw);font-family:var(--body);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{font-family:var(--disp);font-size:16px;text-transform:uppercase;margin-bottom:12px}
.dlgbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.dlgbtns button{flex:1;min-width:90px;padding:10px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:700;cursor:pointer}
.dlgbtns .save{background:var(--tape);color:#161616;border-color:var(--tape)}
.dlgbtns .del{color:var(--now);border-color:var(--now)}
.dlgwarn{border-left:3px solid var(--now);background:#2a1e1d;color:#ffc4bd;font-size:13px;padding:7px 9px;border-radius:4px;margin-bottom:10px}

/* ---------- Sticky Toolbar ---------- */
.toolbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:20}
.toolbar button{flex:1;border-radius:5px;font-family:var(--body);font-weight:700;font-size:14px;padding:11px 2px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.toolbar .primary{background:var(--tape);color:#161616;border-color:var(--tape)}

/* ---------- Einlass (große Zeilen) ---------- */
.searchbar{margin:12px 16px 0}
.searchbar input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-family:var(--body);font-size:20px;padding:14px 14px}

.filterchips button{background:var(--panel2);border:1px solid var(--line);border-radius:14px;color:var(--dim);font-size:13px;padding:5px 11px;cursor:pointer}
.filterchips button.on{background:var(--tape);color:#161616;border-color:var(--tape)}
.elrow{display:flex;align-items:center;gap:12px;min-height:64px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--dim);border-radius:6px;padding:10px 12px;margin:8px 16px 0;cursor:pointer}
.elrow.in{background:#1c2a1c;border-color:var(--ok)}
.elname{font-size:20px;font-weight:700;flex:1;min-width:0}
.elmeta{font-family:var(--mono);font-size:13px;color:var(--dim)}
.elcheck{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ok);white-space:nowrap}
.elcheck.part{color:var(--tape-sig)}
.elcomp{display:flex;flex-direction:column;gap:6px;margin:6px 16px 0}
.compbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:17px;padding:8px 14px;cursor:pointer;text-align:left}
.compbtn.in{background:#1c2a1c;border-color:var(--ok)}
.compbtn .t{font-family:var(--mono);font-size:14px;color:var(--dim)}
.compbtn.in .t{color:var(--ok)}
.dupwarn{color:var(--now);font-weight:700}

/* ---------- Druckliste-Ansicht ---------- */
.printview{margin:12px 16px}
.printview h2{font-family:var(--disp);font-size:18px;text-transform:uppercase}
table.plist{border-collapse:collapse;width:100%;margin-top:10px;font-size:14px}
table.plist th,table.plist td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.plist th{background:var(--panel2);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
table.plist td.bar{width:10px;padding:0}
table.plist td.sign{width:30mm}
.printview .pfoot{margin-top:10px}

/* ---------- Toasts ---------- */
.toasts{position:fixed;left:0;right:0;bottom:76px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;max-width:520px;width:100%;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:6px;padding:10px 12px;font-family:var(--body);font-size:14px;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.45)}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--now)}
.toast-msg{flex:1;min-width:0}
.toast-act{background:var(--tape);color:#161616;border:none;border-radius:4px;font-family:var(--body);font-weight:700;font-size:14px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.toast-x{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;line-height:1;padding:0 2px}

/* ---------- Gästeliste Suche / Chips / Sortierung ---------- */
.glbar{margin:6px 16px 0}
.glbar .glsearch{position:relative}
.glbar .glsearch input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-family:var(--body);font-size:15px;padding:9px 32px 9px 10px}
.glbar .glsearch .glx{position:absolute;top:50%;right:6px;transform:translateY(-50%);background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
.glcount{font-family:var(--mono);font-size:13px;color:var(--dim);margin:5px 0 0}
.glchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.glchips button{background:var(--panel2);border:1px solid var(--line);border-radius:14px;color:var(--dim);font-size:13px;padding:5px 11px;cursor:pointer}
.glchips button.on{background:var(--tape);color:#161616;border-color:var(--tape)}
.glsort{display:flex;gap:0;flex-wrap:wrap;margin:8px 0 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.glsort button{flex:1;min-width:70px;background:var(--panel);border:none;border-right:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:8px 4px;cursor:pointer}

.glsort button.on{background:var(--tape);color:#161616}
.emptybox{margin:12px 16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tape);border-radius:6px;padding:14px 14px}

.artsel{position:relative}
.artsel .artbtn{width:100%;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-family:var(--body);font-size:15px;padding:8px 9px;cursor:pointer;text-align:left}
.artsel .artbtn .artname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.artsel .artbtn .artcar{flex:0 0 auto;color:var(--tape-ink);font-size:12px}
.artsel .artpop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;background:var(--panel);border:1px solid var(--tape);border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.5);padding:6px}
.artsel .artq{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-family:var(--body);font-size:14px;padding:7px 8px;margin-bottom:6px}

.artsel .artlist li span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artsel .artlist li.on{background:var(--panel2)}
.artsel .artlist li.cur{color:var(--tape-ink);font-weight:700}
.artsel .artlist li .artcheck{flex:0 0 auto;color:var(--tape-ink);font-family:var(--mono);font-size:13px}
.artsel .artempty{padding:9px 8px;font-size:14px;color:var(--dim)}
.artsel .artfoot{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:6px 4px 1px}

button,.tabs button,.toolbar button,.chip,.badge{transition:background-color .12s ease,border-color .12s ease,color .12s ease}
#view.fade-in{animation:viewFade .12s ease}
@keyframes viewFade{from{opacity:0}to{opacity:1}}
dialog{animation:dlgPop .14s ease}
dialog::backdrop{animation:backdropFade .14s ease}
@keyframes dlgPop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes backdropFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* Obergrenze je Mengenfeld — eine Gästelistenzeile hat realistisch nie mehr Plätze.
   Ohne Deckel würde ein Vertipper (z. B. 99999) tausende Namensplätze anlegen. */
const MAX_MENGE=999;
const menge=v=>Math.min(MAX_MENGE,Math.max(0,Math.round(+v||0)));
const PLATZ_IDS=PLATZ.map(p=>p.id);
const PASS_IDS=PASS.map(p=>p.id);
const platzById=id=>PLATZ.find(p=>p.id===id)||PLATZ[0];
const passById=id=>PASS.find(p=>p.id===id)||PASS[0];
/* Farbe/Bezeichnung einer Zeile richtet sich nach der größten Platzart (für Balken, Druck, Einlass). */
function hauptPlatz(g){
  let best=null,bn=0;
  PLATZ.forEach(p=>{const n=platzWert(g,p.id);if(n>bn){bn=n;best=p;}});
  return best||PLATZ[0];
}
function platzWert(g,id){return (g&&g.plaetze&&+g.plaetze[id])||0;}
function passWert(g,id){return (g&&g.pass&&+g.pass[id])||0;}

/* ================= migrate ================= */
function migrate(s){
  if(!s||typeof s!=='object')return defaultState();
  // schema:3 additiv — kein bestehendes Feld wird gelöscht, ältere Stände/Importe laufen durch
  if(!Array.isArray(s.tokens))s.tokens=[];
  const altSchema=+s.schema||1;
  s.schema=3;
  if(typeof s.kuenstler!=='string'||!s.kuenstler)s.kuenstler=ARTIST_DEFAULT;
  if(typeof s.tour!=='string')s.tour=(s.kuenstler===ARTIST_DEFAULT?'Live 2026':'');
  s.meta=s.meta||{};
  if(typeof s.meta.savedAt!=='number')s.meta.savedAt=0;
  if(typeof s.meta.autoLoeschTage!=='number')s.meta.autoLoeschTage=14;
  s.shows=Array.isArray(s.shows)?s.shows:[];
  s.gruppen=Array.isArray(s.gruppen)?s.gruppen:[];
  s.einladende=Array.isArray(s.einladende)?s.einladende:[];
  s.gaeste=Array.isArray(s.gaeste)?s.gaeste:[];
  s.gruppenKontingente=s.gruppenKontingente||{};
  s.ui=s.ui||{};
  if(!s.ui.modus)s.ui.modus='verwaltung';
  if(s.ui.werBinIch===undefined)s.ui.werBinIch=null;
  if(s.ui.einlassShowId===undefined)s.ui.einlassShowId=null;
  s.shows.forEach(sh=>{
    if(sh.id==null)sh.id=uid('sh');
    if(sh.deckel!==null&&typeof sh.deckel!=='number')sh.deckel=400;
    if(sh.vertragskontingent===undefined)sh.vertragskontingent=null;
    if(!sh.deadline)sh.deadline='16:00';
    if(sh.deadlineDatum===undefined)sh.deadlineDatum='';
    if(typeof sh.final!=='boolean')sh.final=false;
    if(typeof sh.finalVersion!=='number')sh.finalVersion=0;
    if(sh.finalAt===undefined)sh.finalAt=null;
    if(sh.changedSinceFinal===undefined)sh.changedSinceFinal=false;
    if(sh.banner===undefined)sh.banner='';
    if(typeof sh.geloescht!=='boolean')sh.geloescht=false;
    if(sh.statistikSnapshot===undefined)sh.statistikSnapshot=null;
    // Kopfblock der Vorlage: Kapazitäten, Family-&-Friends-Bereich, Rücksprache-Kontakte, Vorjahresvergleich
    if(sh.kapSteh===undefined)sh.kapSteh=null;
    if(sh.kapSitz===undefined)sh.kapSitz=null;
    if(sh.ffBereich===undefined)sh.ffBereich='';
    if(!Array.isArray(sh.kontakte)||!sh.kontakte.length)sh.kontakte=deepCopy(KONTAKTE_INIT);
    sh.kontakte.forEach(k=>{if(k.rolle===undefined)k.rolle='';if(k.name===undefined)k.name='';if(k.mobil===undefined)k.mobil='';
      if(KONTAKT_ROLLE_AUSSCHREIBEN[k.rolle])k.rolle=KONTAKT_ROLLE_AUSSCHREIBEN[k.rolle];});
    if(typeof sh.vorjahrTitel!=='string'||sh.vorjahrTitel==='GL Vorjahr')sh.vorjahrTitel='Gästeliste Vorjahr';
    if(!Array.isArray(sh.vorjahr)||!sh.vorjahr.length)sh.vorjahr=deepCopy(VORJAHR_INIT);
    sh.vorjahr.forEach(v=>{if(v.label===undefined)v.label='';if(v.wert===undefined)v.wert=null;});
  });
  s.gruppen.forEach(g=>{
    if(g.id==null)g.id=uid('gr');
    if(typeof g.autoGenehmigen!=='boolean')g.autoGenehmigen=false;
    // Alte Gruppennamen auf die Pool-Bezeichnungen der Vorlage bringen (nur die Standardnamen)
    if(altSchema<3&&POOL_UMBENENNEN[g.name])g.name=POOL_UMBENENNEN[g.name];
    if(POOL_KUERZEL_AUSSCHREIBEN[g.name])g.name=POOL_KUERZEL_AUSSCHREIBEN[g.name];
    if(!Array.isArray(g.erlaubtePlatzarten)||!g.erlaubtePlatzarten.length)g.erlaubtePlatzarten=ALLPLATZ();
    g.erlaubtePlatzarten=g.erlaubtePlatzarten.filter(id=>PLATZ_IDS.indexOf(id)>=0);
    if(!g.erlaubtePlatzarten.length)g.erlaubtePlatzarten=ALLPLATZ();
    if(g.erlaubteKategorien!==undefined)delete g.erlaubteKategorien;
    if(typeof g.aftershowErlaubt!=='boolean')g.aftershowErlaubt=true;
    if(!s.gruppenKontingente[g.id])s.gruppenKontingente[g.id]={std:null,ausnahmen:{}};
  });
  // Fehlende Pools der Vorlage ergänzen — bestehende bleiben unangetastet.
  // Auch bei einer Datei ganz ohne Pools entsteht so wieder eine brauchbare Auswahl.
  if(altSchema<3||!s.gruppen.length){
    POOL_INIT.forEach(p=>{
      if(s.gruppen.some(g=>g.name===p.name))return;
      const ng={id:uid('gr'),name:p.name,autoGenehmigen:false,erlaubtePlatzarten:ALLPLATZ(),aftershowErlaubt:true};
      s.gruppen.push(ng);
      s.gruppenKontingente[ng.id]={std:p.kont,ausnahmen:{}};
    });
  }
  s.einladende.forEach(p=>{
    if(p.id==null)p.id=uid('p');
    if(typeof p.stdKontingent!=='number')p.stdKontingent=10;
    if(!p.ausnahmen)p.ausnahmen={};
  });
  s.gaeste.forEach(g=>{
    if(g.id==null)g.id=uid('g');
    if(!Array.isArray(g.begleitungen))g.begleitungen=[];
    g.begleitungen.forEach(b=>{if(b.checkinAt===undefined)b.checkinAt=null;if(b.name===undefined)b.name='';});
    if(!g.status)g.status='angefragt';
    if(g.checkinAt===undefined)g.checkinAt=null;
    if(g.notiz===undefined)g.notiz='';
    if(typeof g.aftershow!=='boolean')g.aftershow=false;
    if(typeof g.nachtrag!=='boolean')g.nachtrag=false;
    if(typeof g.autoGenehmigt!=='boolean')g.autoGenehmigt=false;
    if(g.createdAt===undefined)g.createdAt=Date.now();
    // Spalten der Vorlage
    if(typeof g.email!=='string')g.email='';
    if(typeof g.referenz!=='string')g.referenz='';
    if(g.mailoutAt===undefined)g.mailoutAt=null;
    // Alte Einzel-Kategorie → Mengen je Platzart/Zusatzausweis (Personenzahl bleibt exakt gleich)
    if(!g.plaetze||typeof g.plaetze!=='object'){
      const pers=1+g.begleitungen.length;
      g.plaetze=leerePlaetze();
      const alt=g.kategorieId;
      if(alt==='aftershow')g.plaetze.aftershow=pers;
      else if(alt==='working')g.plaetze.kat4=pers;
      else g.plaetze.steh=pers;
      if(!g.pass||typeof g.pass!=='object'){
        g.pass=leerePaesse();
        if(alt==='aaa')g.pass.aaa=pers;
        if(alt==='photo')g.pass.foto=pers;
      }
    }
    if(!g.pass||typeof g.pass!=='object')g.pass=leerePaesse();
    PLATZ_IDS.forEach(k=>{g.plaetze[k]=menge(g.plaetze[k]);});
    PASS_IDS.forEach(k=>{g.pass[k]=menge(g.pass[k]);});
    if(plaetzeSum(g)<1)g.plaetze.steh=1;
    if(g.kategorieId!==undefined)delete g.kategorieId;
    syncBegleitungen(g);
  });
  return s;
}
/* Personen-Plätze und Namensplätze zusammenhalten:
   Summe der Platzarten = Personenzahl = Hauptgast + Begleitungen. */
function plaetzeSum(g){let n=0;PLATZ_IDS.forEach(k=>{n+=(g&&g.plaetze&&+g.plaetze[k])||0;});return n;}
function syncBegleitungen(g){
  if(!Array.isArray(g.begleitungen))g.begleitungen=[];
  const soll=Math.min(MAX_MENGE*PLATZ_IDS.length,Math.max(0,plaetzeSum(g)-1));
  while(g.begleitungen.length<soll)g.begleitungen.push({name:'',checkinAt:null});
  while(g.begleitungen.length>soll){
    // zuerst die namenlosen und noch nicht eingecheckten Plätze abbauen — nie eine Anwesenheit verlieren
    let idx=-1;
    for(let k=g.begleitungen.length-1;k>=0;k--){const b=g.begleitungen[k];if((!b.name||!b.name.trim())&&!b.checkinAt){idx=k;break;}}
    if(idx<0)for(let k=g.begleitungen.length-1;k>=0;k--){if(!g.begleitungen[k].checkinAt){idx=k;break;}}
    if(idx<0)idx=g.begleitungen.length-1;
    g.begleitungen.splice(idx,1);
  }
}

/* ================= Persistenz ================= */
/* Jeder Künstler hat einen eigenen Arbeitsbereich (eigener Speicher-Schlüssel).
   AnnenMayKantereit behält den bisherigen Schlüssel — bestehende Stände bleiben erhalten. */
const LS_BASE='amk-gl-2026';
function wsKey(artist){return (!artist||artist===ARTIST_DEFAULT)?LS_BASE:LS_BASE+'::'+slug(artist);}
let LS_KEY=LS_BASE;
let memFallback={};
let state=defaultState();

let stateGen=0;
function save(){
  stateGen++;
  if(pendingUndo&&pendingUndo.gen!==stateGen){
    if(pendingUndo.dismiss){try{pendingUndo.dismiss();}catch(e){}}
    pendingUndo=null;
  }
  state.meta.savedAt=Date.now();
  const j=JSON.stringify(state);
  try{localStorage.setItem(LS_KEY,j);}catch(e){memFallback[LS_KEY]=j;}
  if(prefs&&prefs.changedSinceExport!==true){prefs.changedSinceExport=true;savePrefs();}
  const d=new Date(state.meta.savedAt);
  const el=$('savedAt');
  if(el)el.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function load(){
  let j=null;
  try{j=localStorage.getItem(LS_KEY);}catch(e){j=null;}
  if(!j)j=memFallback[LS_KEY]||null;
  if(j){try{state=migrate(JSON.parse(j));}catch(e){state=defaultState();}}
  else state=defaultState();
  // Der Arbeitsbereich bestimmt den Künstler — nicht umgekehrt (schützt vor falsch beschrifteten Ständen).
  const a=curArtist||ARTIST_DEFAULT;
  if(state.kuenstler!==a){state.kuenstler=a;if(a!==ARTIST_DEFAULT&&state.tour==='Live 2026')state.tour='';}
}
// Zustandsmaschinen-Guard: Status-Rang verhindert Downgrade (widerrufen/eingelöst bleiben).
const TOKEN_STATUS_RANK={offen:0,eingeloest:1,widerrufen:2};
function tokenRank(s){return TOKEN_STATUS_RANK[s]!=null?TOKEN_STATUS_RANK[s]:0;}
function mergeToken(current,incoming){
  const rc=tokenRank(current.status),ri=tokenRank(incoming.status);
  if(ri>rc){Object.assign(current,incoming);return current;} // erlaubter Übergang
  if(ri<rc)return current; // kein Downgrade
  if((incoming.updatedAt||0)>(current.updatedAt||0))Object.assign(current,incoming); // gleicher Rang: neuer gewinnt
  return current;
}
// Befund #1: NUR state.tokens aus localStorage neu einlesen und per id mergen.
// Gäste/Shows/Einstellungen bleiben unangetastet, damit laufende TM-Eingaben nicht verloren gehen.
function syncTokensFromStorage(){
  let stored;
  try{const j=localStorage.getItem(LS_KEY)||memFallback[LS_KEY];if(!j)return;stored=JSON.parse(j);}catch(e){return;}
  if(!stored||!Array.isArray(stored.tokens))return;
  if(!Array.isArray(state.tokens))state.tokens=[];
  const byId={};state.tokens.forEach(t=>{if(t&&t.id)byId[t.id]=t;});
  stored.tokens.forEach(st=>{
    if(!st||!st.id)return;
    const cur=byId[st.id];
    if(!cur){state.tokens.push(st);byId[st.id]=st;return;}
    mergeToken(cur,st);
  });
}

/* ================= Toast (F1.2) ================= */
const Toast={
  show(text,opts){
    opts=opts||{};
    const wrap=$('toasts');if(!wrap)return ()=>{};
    const t=ael('div','toast '+(opts.type||'info'));
    t.appendChild(ael('span','toast-msg',text));
    let tm=null;
    const dismiss=()=>{if(tm)clearTimeout(tm);tm=null;if(t.parentNode)t.parentNode.removeChild(t);};
    if(opts.action){
      const b=ael('button','toast-act',opts.action.label);
      b.onclick=()=>{try{opts.action.on();}catch(e){}dismiss();};
      t.appendChild(b);
    }
    const x=ael('button','toast-x','×');x.setAttribute('aria-label','Schließen');x.onclick=dismiss;
    t.appendChild(x);
    wrap.appendChild(t);
    tm=setTimeout(dismiss,opts.ms||3500);
    return dismiss;
  }
};

/* ================= Einstellungen-Träger (F4.1/F4.6) — strikt getrennt vom Datenmodell ================= */
const PREFS_KEY='amk-gl-prefs';
let prefs={};
function loadPrefs(){
  try{const j=localStorage.getItem(PREFS_KEY);prefs=j?JSON.parse(j):{};}catch(e){prefs={};}
  if(!prefs||typeof prefs!=='object')prefs={};
  // Standard: Tabellenansicht wie in der bisherigen Gästelisten-Tabelle
  if(prefs.ansicht!=='karten')prefs.ansicht='tabelle';
  if(prefs.spalten!=='benutzt')prefs.spalten='alle';
  // P10: Dunkel ist wieder der Standard; Hell nur, wenn ausdrücklich umgestellt wurde.
  if(prefs.theme!=='dark'&&prefs.theme!=='light')prefs.theme='dark';
}
function savePrefs(){try{localStorage.setItem(PREFS_KEY,JSON.stringify(prefs));}catch(e){}}

/* ================= Undo (F1.3) — Ein-Slot-Snapshot ================= */
let pendingUndo=null;
function withUndo(label,mutator,refresh){
  refresh=refresh||render;
  // Ein-Slot-Prinzip auch im UI: alten „Rückgängig"-Toast entfernen, bevor ein neuer erscheint
  if(pendingUndo&&pendingUndo.dismiss){try{pendingUndo.dismiss();}catch(e){}}
  pendingUndo=null;
  const snap=deepCopy(state);
  mutator();
  save();refresh(); // save() bumpt stateGen und invalidiert evtl. altes pendingUndo
  const gen=stateGen;
  const dismiss=Toast.show(label,{type:'info',ms:8000,action:{label:'Rückgängig',on:()=>{
    if(!pendingUndo||pendingUndo.gen!==stateGen){Toast.show('Rückgängig nicht mehr möglich (zwischenzeitliche Änderung).',{type:'warn'});return;}
    const snapBack=pendingUndo.snap;pendingUndo=null;
    state=snapBack;save();refresh();
    Toast.show('Rückgängig gemacht.',{type:'ok'});
  }}});
  pendingUndo={snap:snap,gen:gen,dismiss:dismiss};
  setTimeout(()=>{if(pendingUndo&&pendingUndo.gen===gen)pendingUndo=null;},8200);
}

  const platzPlan=['steh','steh','sitz','steh','kat4','steh','aftershow','steh','sitz'];
  const passPlan =[null,'aaa',null,'foto',null,null,'ff',null,'aaa'];
  const DEMO_REF=['Rolling Stone','Backstage Pro','Radio Eins','ByteFM','Musikexpress','Örtl. Veranstalter','Sponsor Getränke','Tourbus-Crew','Support-Band','Label A&R'];
  const now=Date.now();
  // 7 Einträge (teilerfremd zu den 5 Shows) — dadurch hat jede Show offene Anträge,
  // Genehmigte und Abgelehnte, sonst wäre die Freigabe auf der Startshow leer.
  const statusPlan=['genehmigt','angefragt','genehmigt','abgelehnt','genehmigt','angefragt','genehmigt'];
  const created=[];
  for(let i=0;i<40;i++){
    const sh=shows[i%shows.length];
    const p=einl[i%einl.length];
    const status=statusPlan[i%statusPlan.length];
    const nComp=(i%4===0)?(i%3):0;
    const begl=[];
    for(let c=0;c<nComp;c++)begl.push({name:(c%2===0?DEMO_VN[(i+c+5)%40]+' '+DEMO_NN[(i+c+7)%40]:''),checkinAt:null});
    const approved=(status==='genehmigt'||status==='final');
    let checkinAt=null;
    if(approved&&i%3===0)checkinAt=now-3600000+i*60000;
    if(checkinAt&&begl.length&&i%2===0)begl[0].checkinAt=now-1800000;
    const plaetze=leerePlaetze();
    plaetze[platzPlan[i%platzPlan.length]]=1+nComp;   // Summe der Plätze = Personenzahl
    const paesse=leerePaesse();
    const pk=passPlan[i%passPlan.length];
    if(pk)paesse[pk]=1;
    state.gaeste.push({
      id:uid('g'),vorname:DEMO_VN[i%40],nachname:DEMO_NN[i%40],
      email:slug(DEMO_VN[i%40])+'.'+slug(DEMO_NN[i%40])+'@example.com',
      begleitungen:begl,plaetze:plaetze,pass:paesse,
      referenz:(i%3===0?DEMO_REF[i%DEMO_REF.length]:''),
      einladenderId:p.id,gruppeId:p.gruppeId,
      showId:sh.id,status:status,checkinAt:checkinAt,
      notiz:(i%7===0?'VIP-Gast, bitte am Eingang abholen':''),
      aftershow:(i%5===0),nachtrag:false,autoGenehmigt:false,
      mailoutAt:(i<14?now-7200000:null),
      createdAt:now-((40-i)*90000),_demo:true
    });
    created.push(state.gaeste[state.gaeste.length-1]);
  }
  if(!Array.isArray(state.tokens))state.tokens=[];
  const cand=created.filter(g=>g.status==='genehmigt'||g.status==='final');
  // Bewusst gemischt: einmal Show mit Sitzplan (Kauf), einmal Stehplatz-Show, dazu ein
  // weiterer Gast — sonst zeigt die Vorführung zufällig nur eine der beiden Varianten.
  const genommen=new Set();
  const istSitz=s=>{const m=tkMap(s);return !!m&&m.typ==='seated';};
  const waehle=pred=>cand.find(g=>{const s=showById(g.showId);return s&&!genommen.has(g.id)&&pred(s);});
  const plan=[];
  const gSitz=waehle(istSitz);            if(gSitz){genommen.add(gSitz.id);plan.push({g:gSitz,modus:'kauf',max:2});}
  const gSteh=waehle(s=>!istSitz(s));     if(gSteh){genommen.add(gSteh.id);plan.push({g:gSteh,modus:'kontingent',max:1});}
  const gRest=cand.find(g=>!genommen.has(g.id)); if(gRest){genommen.add(gRest.id);plan.push({g:gRest,modus:'kontingent',max:1});}
  plan.forEach((tp,ix)=>{
    const g=tp.g;
    state.tokens.push({
      id:'tk'+now+ix+Math.floor(Math.random()*1e5),
      gastRef:g.id,email:slug(g.vorname)+'.'+slug(g.nachname)+'@example.com',
      showId:g.showId,modus:tp.modus,maxPlaetze:tp.max,kategorieRahmen:null,
      status:'offen',ausgewaehltePlaetze:[],createdAt:now,redeemedAt:null,updatedAt:now,_demo:true
    });
  });
  save();render();
  Toast.show(created.length+' Demo-Gäste geladen.',{type:'ok'});
}
function removeDemoData(){
  const gc=state.gaeste.filter(g=>g._demo).length;
  const tc=(state.tokens||[]).filter(t=>t._demo).length;
  if(!gc&&!tc){Toast.show('Keine Demo-Daten vorhanden.',{type:'info'});return;}
  if(!confirm('Demo-Daten entfernen: '+gc+' Gäste und '+tc+' Token werden gelöscht. Fortfahren?'))return;
  state.gaeste=state.gaeste.filter(g=>!g._demo);

}

  PASS.forEach(p=>{const n=passWert(g,p.id);if(n)t.push(p.sp+' '+n);});

}

/* ================= Kommende Shows vs. Archiv =================
   „Archiv“ = alles vor dem heutigen Tag. Der Showtag selbst zählt noch als kommend,
   damit am Veranstaltungstag nichts ins Archiv rutscht. */
function showVergangen(s){return !!(s&&s.datum&&String(s.datum)<todayISO());}
function showsSortiert(list){return (list||[]).slice().sort((a,b)=>String(a.datum||'').localeCompare(String(b.datum||'')));}
function showsKommend(list){return showsSortiert((list||[]).filter(s=>!showVergangen(s)));}
function showsArchiv(list){return showsSortiert((list||[]).filter(showVergangen)).reverse();}
/* Nächste Veranstaltung (Start-Show). Ohne kommende Show die zuletzt gespielte. */
function naechsteShowId(list){
  const arr=showsSortiert(list);
  const pick=showsKommend(arr.filter(s=>!s.geloescht))[0]||showsKommend(arr)[0]||arr[arr.length-1]||null;
  return pick?pick.id:null;
}
/* Beim Start immer die nächste Veranstaltung zeigen — vergangene nur über das Archiv. */
function starteMitNaechsterShow(){
  if(!state.shows.length)return;
  const cur=showById(state.ui.aktiveShowId);
  if(cur&&!showVergangen(cur))return;
  const id=naechsteShowId(state.shows);
  if(id&&id!==state.ui.aktiveShowId){state.ui.aktiveShowId=id;save();}
}
/* Show-Dropdown mit Archiv-Gruppe: kommende aufsteigend, Archiv (neueste zuerst) darunter. */
function fillShowSelect(sel,list,curId,labFn){
  sel.innerHTML='';
  const kommend=showsKommend(list),archiv=showsArchiv(list);
  const addTo=(parent,s)=>{const o=document.createElement('option');o.value=s.id;o.textContent=labFn(s);
    if(curId&&s.id===curId)o.selected=true;parent.appendChild(o);};
  if(kommend.length){
    if(archiv.length){const g=document.createElement('optgroup');g.label='Kommende Shows';kommend.forEach(s=>addTo(g,s));sel.appendChild(g);}
    else kommend.forEach(s=>addTo(sel,s));
  }
  if(archiv.length){
    const g=document.createElement('optgroup');g.label='Archiv · gespielte Shows';archiv.forEach(s=>addTo(g,s));sel.appendChild(g);
  }
  return sel;
}

/* Personen-Zählung — wie in der Vorlage die Summe der Platzarten (Steh+Sitz+Aftershow+Kat 4).
   Zusatzausweise (AAA, F/F, Foto) zählen bewusst NICHT mit, genau wie in der Tabelle. */
function personsPlanned(g){const n=plaetzeSum(g);return n>0?n:1;}
/* Summen je Platzart/Zusatzausweis über eine Gästemenge — für Kopfblock und Summenzeile. */
function spaltenSumme(list,id){
  let n=0;
  list.forEach(g=>{n+=(PLATZ_IDS.indexOf(id)>=0)?platzWert(g,id):passWert(g,id);});
  return n;
}
function personsCheckedIn(g){
  let n=g.checkinAt?1:0;
  (g.begleitungen||[]).forEach(b=>{if(b.checkinAt)n++;});
  return n;
}
const APPROVED=g=>g.status==='genehmigt'||g.status==='final';

/* Wirksames Kontingent (Ausnahme schlägt Standard) */
function grpQuota(gruppeId,showId){
  const q=state.gruppenKontingente[gruppeId];if(!q)return null;
  const ex=q.ausnahmen&&q.ausnahmen[showId];
  return (ex!=null&&ex!=='')?+ex:(q.std!=null?+q.std:null);
}
function personQuota(pId,showId){
  const p=pById(pId);if(!p)return null;
  const ex=p.ausnahmen&&p.ausnahmen[showId];
  return (ex!=null&&ex!=='')?+ex:(p.stdKontingent!=null?+p.stdKontingent:null);
}

/* Zähler je Pool/c-o-Person/Show — personengenau */
function tally(list){
  let beantragt=0,genehmigt=0,eingecheckt=0;
  list.forEach(g=>{
    const pers=personsPlanned(g);
    if(g.status==='angefragt')beantragt+=pers;
    if(APPROVED(g)){genehmigt+=pers;eingecheckt+=personsCheckedIn(g);}
  });
  return {beantragt,genehmigt,eingecheckt};
}
const tallyGrpShow=(gruppeId,showId)=>tally(state.gaeste.filter(g=>g.gruppeId===gruppeId&&g.showId===showId));
const tallyPersonShow=(pId,showId)=>tally(state.gaeste.filter(g=>g.einladenderId===pId&&g.showId===showId));

/* Deckel-Nutzung: genehmigte Personen der Show */
function deckelUsed(showId){
  return state.gaeste.filter(g=>g.showId===showId&&APPROVED(g))
    .reduce((s,g)=>s+personsPlanned(g),0);
}

/* Deadline */
function deadlineMs(show){
  const dstr=(show.deadlineDatum&&show.deadlineDatum.length)?show.deadlineDatum:show.datum;
  if(!dstr)return null;
  const m=toMin(show.deadline||'16:00');if(m==null)return null;
  const d=new Date(dstr+'T00:00:00');if(isNaN(d))return null;
  d.setMinutes(m);return d.getTime();
}
function deadlinePassed(show){const ms=deadlineMs(show);return ms!=null&&Date.now()>=ms;}
function countdownText(show){
  const ms=deadlineMs(show);if(ms==null)return {t:'—',red:false};
  let diff=Math.floor((ms-Date.now())/60000);
  if(diff<=0)return {t:'Redaktionsschluss',red:true};
  const h=Math.floor(diff/60),mm=diff%60;
  const t=h>0?(h+':'+String(mm).padStart(2,'0')+' h'):(mm+' min');
  return {t,red:diff<60};
}

/* ================= Suche ohne Umlaut-Stolperfallen =================
   Am Einlass wird oft ohne Umlaute getippt. „kruger", „krueger" und „Krüger"
   müssen denselben Gast finden — deshalb je Text drei Schreibweisen vergleichen. */
function suchFormen(s){
  const l=String(s||'').toLowerCase();
  const ohne=l.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss');
  const lang=l.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  return [l,ohne,lang];
}
function suchTreffer(text,frage){
  const q=String(frage||'').trim();
  if(!q)return true;
  const H=suchFormen(text),Q=suchFormen(q);
  return H.some(h=>Q.some(qq=>h.indexOf(qq)>=0));
}

/* Duplikate innerhalb einer Show */
function normName(v,n){return ((v||'')+' '+(n||'')).replace(/\s+/g,' ').trim().toLowerCase();}
function isDuplicate(g){
  const key=normName(g.vorname,g.nachname);
  return state.gaeste.some(o=>o.id!==g.id&&o.showId===g.showId&&normName(o.vorname,o.nachname)===key);
}

const NAV_BEREICHE=[
  {m:'verwaltung',label:'Verwaltung',icon:'icon-verwaltung'},
  {m:'einladen',  label:'Einladen',  icon:'icon-einladen'},
  {m:'einlass',   label:'Einlass',   icon:'icon-einlass'},

];
let navSpy=null;
/* Der Kopf klebt oben; seine tatsächliche Höhe steuert Menüleiste und Sprungmarken. */
function measureHeader(){
  const h=document.querySelector('header');if(!h)return;
  document.documentElement.style.setProperty('--hdrh',Math.round(h.getBoundingClientRect().height)+'px');
}
function navIcon(name){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','icon');svg.setAttribute('aria-hidden','true');
  const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#'+name);

function buildSideNav(){
  const nav=$('sidenav');if(!nav)return;
  if(navSpy){navSpy.disconnect();navSpy=null;}
  nav.innerHTML='';
  nav.appendChild(ael('h3',null,'Bereiche'));
  NAV_BEREICHE.forEach(b=>{
    const btn=ael('button','navbtn'+(state.ui.modus===b.m?' active':''));
    btn.type='button';
    btn.appendChild(navIcon(b.icon));
    btn.appendChild(document.createTextNode(b.label));
    if(state.ui.modus===b.m)btn.setAttribute('aria-current','page');
    btn.onclick=()=>setModus(b.m);
    nav.appendChild(btn);
  });
  /* Sprungmarken: jede Überschrift des gerade geöffneten Bereichs. */
  const heads=Array.from(document.querySelectorAll('#view .sechead'));
  const jumps=[];
  if(heads.length){
    nav.appendChild(ael('h3',null,'In diesem Bereich'));
    heads.forEach((h,i)=>{
      const t=h.querySelector('h2');if(!t)return;
      if(!h.id)h.id='sprung-'+i;
      const btn=ael('button','navjump',t.textContent.trim());
      btn.type='button';
      btn.dataset.ziel=h.id;
      btn.onclick=()=>{const el=document.getElementById(h.id);if(el)el.scrollIntoView({block:'start'});};
      nav.appendChild(btn);
      jumps.push({btn:btn,head:h});
    });
  }
  nav.appendChild(ael('div','navsep'));
  nav.appendChild(ael('h3',null,'Schnellzugriff'));
  const set=ael('button','navbtn quick');
  set.type='button';set.appendChild(navIcon('icon-gear'));
  set.appendChild(document.createTextNode('Einstellungen'));
  set.onclick=openSettingsDlg;
  nav.appendChild(set);
  const imp=ael('button','navbtn quick');
  imp.type='button';imp.appendChild(navIcon('icon-json'));
  imp.appendChild(document.createTextNode('Liste einlesen'));
  imp.onclick=openImportDlg;
  nav.appendChild(imp);
  const top=ael('button','navbtn quick','Nach oben');
  top.type='button';
  top.onclick=()=>window.scrollTo({top:0});
  nav.appendChild(top);
  /* Der Abschnitt, in dem man gerade liest, wird in der Leiste hervorgehoben. */
  if(jumps.length&&'IntersectionObserver' in window){
    const sichtbar=new Set();
    navSpy=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting)sichtbar.add(e.target.id);else sichtbar.delete(e.target.id);});
      let aktiv=null;
      for(const j of jumps){if(sichtbar.has(j.head.id)){aktiv=j.head.id;break;}}
      jumps.forEach(j=>j.btn.classList.toggle('active',aktiv===j.head.id));
    },{rootMargin:'-'+(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hdrh'))||96)+'px 0px -55% 0px'});
    jumps.forEach(j=>navSpy.observe(j.head));
  }
}

/* Ausklappbare Auswahl: 15 Zeilen sichtbar, darüber hinaus scrollbar, mit Sofortsuche */
function artistCombo(){
  const wrap=ael('div','artsel');
  const btn=ael('button','artbtn');btn.type='button';
  btn.setAttribute('aria-haspopup','listbox');
  btn.setAttribute('aria-expanded','false');
  btn.appendChild(ael('span','artname',state.kuenstler||ARTIST_DEFAULT));
  btn.appendChild(ael('span','artcar','▼'));
  wrap.appendChild(btn);
  let pop=null,items=[],idx=-1;
  const onDoc=e=>{if(pop&&!wrap.contains(e.target))close();};
  function close(){
    if(pop){pop.remove();pop=null;}
    btn.setAttribute('aria-expanded','false');
    document.removeEventListener('mousedown',onDoc,true);
  }
  function open(){
    if(pop)return;
    pop=ael('div','artpop');
    const q=document.createElement('input');
    q.className='artq';q.type='search';q.placeholder='Suchen …';
    q.setAttribute('aria-label','Künstler oder Band suchen');
    const ul=document.createElement('ul');ul.className='artlist';
    ul.setAttribute('role','listbox');ul.setAttribute('aria-label','Künstler und Bands');
    const foot=ael('div','artfoot','');
    pop.appendChild(q);pop.appendChild(ul);pop.appendChild(foot);
    wrap.appendChild(pop);
    btn.setAttribute('aria-expanded','true');
    function mark(scroll){
      const lis=ul.querySelectorAll('li');
      lis.forEach((li,i)=>li.classList.toggle('on',i===idx));
      if(scroll&&lis[idx])lis[idx].scrollIntoView({block:'nearest'});
    }
    function draw(){
      const term=q.value.trim();
      items=artistsSorted().filter(a=>suchTreffer(a,term));
      ul.innerHTML='';
      if(!items.length){ul.appendChild(ael('div','artempty','Kein Treffer.'));}
      items.forEach(a=>{
        const li=document.createElement('li');li.setAttribute('role','option');
        li.appendChild(ael('span','n',a));
        const cur=(a===state.kuenstler);
        li.setAttribute('aria-selected',cur?'true':'false');
        if(cur){li.classList.add('cur');li.appendChild(ael('span','artcheck','✓'));}
        li.onmousedown=e=>e.preventDefault();   // Fokus bleibt im Suchfeld
        li.onclick=()=>{close();switchArtist(a);};
        ul.appendChild(li);
      });
      foot.textContent=items.length+' von '+LS_ARTISTS.length+' · 15 Zeilen sichtbar, scrollbar';
      idx=Math.max(0,items.indexOf(state.kuenstler));
      mark(false);
    }
    q.oninput=draw;
    q.onkeydown=e=>{
      if(e.key==='ArrowDown'){e.preventDefault();if(idx<items.length-1)idx++;mark(true);}
      else if(e.key==='ArrowUp'){e.preventDefault();if(idx>0)idx--;mark(true);}
      else if(e.key==='Home'){e.preventDefault();idx=0;mark(true);}
      else if(e.key==='End'){e.preventDefault();idx=items.length-1;mark(true);}
      else if(e.key==='Enter'){e.preventDefault();const a=items[idx];if(a){close();switchArtist(a);}}
      else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();btn.focus();}
      else if(e.key==='Tab'){close();}
    };
    draw();
    setTimeout(()=>{
      const lis=ul.querySelectorAll('li');
      if(lis[idx])lis[idx].scrollIntoView({block:'center'});
      q.focus();
    },0);

/* F3.1 dezente Icons vor Toolbar-Beschriftungen — Text/Reihenfolge unveraendert */
function toolIcon(label){
  if(/^\+ ?Gast/.test(label))return 'icon-gastplus';
  if(/^(Exporte|Token-Export)/.test(label))return 'icon-export';
  if(/^(JSON-Export|JSON-Import|Token-Import)/.test(label))return 'icon-json';
  if(/^Drucken/.test(label))return 'icon-print';
  return null;
}
function setTools(btns){
  const tb=$('tools');tb.innerHTML='';
  btns.forEach(b=>{
    const el=document.createElement('button');
    if(b.cls)el.className=b.cls;
    const ic=toolIcon(b.label);
    if(ic){
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','icon tlbicon');svg.setAttribute('aria-hidden','true');
      const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#'+ic);
      svg.appendChild(use);el.appendChild(svg);
    }
    el.appendChild(document.createTextNode(b.label));
    if(b.hideEinfach)el.classList.add('einfach-hide');
    if(b.disabled)el.disabled=true;
    if(b.title)el.title=b.title;
    el.onclick=b.on;

  });

/* ================= Auto-Genehmigung (V3) ================= */
// g ist bereits mit status 'angefragt' in state.gaeste; prüft beide Kontingent-Ebenen + Deckel + Deadline
function tryAutoApprove(g){
  const grp=grpById(g.gruppeId);if(!grp||!grp.autoGenehmigen)return false;
  const show=showById(g.showId);if(!show||show.final||deadlinePassed(show))return false;
  const pers=personsPlanned(g);
  const gq=grpQuota(g.gruppeId,g.showId);
  const pq=personQuota(g.einladenderId,g.showId);
  const curG=tallyGrpShow(g.gruppeId,g.showId).genehmigt;
  const curP=tallyPersonShow(g.einladenderId,g.showId).genehmigt;
  if(gq!=null&&curG+pers>gq)return false;
  if(pq!=null&&curP+pers>pq)return false;
  if(show.deckel!=null&&deckelUsed(g.showId)+pers>show.deckel)return false;
  g.status='genehmigt';g.autoGenehmigt=true;
  return true;
}

/* Balken-Helfer */
function bar(used,max){
  const wrap=ael('div','minib');const i=ael('i',null);
  let pct=0,over=false;
  if(max!=null&&max>0){pct=Math.round(used/max*100);over=used>max;}
  else if(max===0&&used>0){pct=100;over=true;}
  i.style.width=Math.min(100,pct)+'%';if(over)i.classList.add('over');
  wrap.appendChild(i);return wrap;
}

function toggleFinal(sh){
  if(sh.final){
    if(!confirm('Finalisierung von „'+(sh.stadt||'')+'“ aufheben? Nächste Finalisierung zählt die Version hoch.'))return;
    sh.final=false;
    state.gaeste.forEach(g=>{if(g.showId===sh.id&&g.status==='final')g.status='genehmigt';});
    save();render();Toast.show('Finalisierung aufgehoben.',{type:'info'});return;
  }
  const gen=state.gaeste.filter(g=>g.showId===sh.id&&g.status==='genehmigt').length;
  const off=state.gaeste.filter(g=>g.showId===sh.id&&g.status==='angefragt').length;
  if(!confirm('Liste „'+(sh.stadt||'')+'“ finalisieren?\n'+gen+' genehmigte Gäste werden eingefroren, '+off+' offene Anträge bleiben angefragt (nicht auf der finalen Liste).'))return;
  sh.final=true;sh.finalVersion++;sh.finalAt=Date.now();sh.changedSinceFinal=false;
  state.gaeste.forEach(g=>{if(g.showId===sh.id&&g.status==='genehmigt')g.status='final';});
  save();render();Toast.show('Liste finalisiert (v'+sh.finalVersion+').',{type:'ok'});
}

/* V3 Freigabe-Workflow */
function guestName(g){return (g.nachname||'')+' '+(g.vorname||'');}
function setStatus(ids,st){
  if(st==='genehmigt'){
    const finalNachtrag=ids.some(id=>{const g=state.gaeste.find(x=>x.id===id);const sh=g&&showById(g.showId);return sh&&sh.final;});
    if(finalNachtrag&&!confirm('Diese Show ist bereits finalisiert. Die Freigabe wird als Nachtrag auf die finale Liste gesetzt und die Liste als „geändert" markiert (bitte neu exportieren!). Fortfahren?'))return;
  }
  const apply=()=>{
    ids.forEach(id=>{const g=state.gaeste.find(x=>x.id===id);if(!g)return;const sh=showById(g.showId);
      if(st==='genehmigt'&&sh&&sh.final){g.status='final';g.nachtrag=true;g.autoGenehmigt=false;sh.changedSinceFinal=true;}
      else{g.status=st;g.autoGenehmigt=false;}});
  };
  const n=ids.length;
  if(st==='abgelehnt'){
    withUndo(n>1?(n+' Anträge abgelehnt.'):'Antrag abgelehnt.',apply);
  }else{
    apply();save();render();
    if(st==='genehmigt')Toast.show(n>1?(n+' Gäste genehmigt.'):'Gast genehmigt.',{type:'ok'});
  }
}

  function guestTable(list){
    const wrapT=ael('div','gtwrap');

    const nurBenutzte=(prefs.spalten==='benutzt');

    if(bulkOn)cols.push({k:'sel',t:''});

    cols.push({k:'notiz',t:'Notiz'});

    const thead=document.createElement('thead');
    const trh=document.createElement('tr');
    cols.forEach(c=>{const th=ael('th',c.cls||null,c.t);if(c.tip)th.title=c.tip;trh.appendChild(th);});
    thead.appendChild(trh);
    // Summenzeile wie Zeile „total“ im Kopf der Tabelle
    const trs=document.createElement('tr');trs.className='gtsum';
    const daSum=list.reduce((s,g)=>s+personsCheckedIn(g),0);
    cols.forEach(c=>{
      let v='';

  /* Direktes Ändern einer Mengen-Zelle — Plätze und Namensplätze bleiben synchron.
     Danach wird die ganze Ansicht neu berechnet (Kopfblock, Pools, Summenzeile);
     der Eingabefokus wandert dabei genau dorthin, wo er ohnehin hin wollte. */
  function zellWert(g,istPlatz,key,inputEl){
    const roh=Math.max(0,Math.round(+inputEl.value||0));
    const neu=Math.min(MAX_MENGE,roh);
    if(roh>MAX_MENGE){Toast.show('Höchstens '+MAX_MENGE+' je Spalte — Eingabe wurde begrenzt.',{type:'warn'});inputEl.value=neu;}
    const ziel=state.gaeste.find(x=>x.id===g.id);
    if(!ziel){paint();return;}
    if(istPlatz){
      const vorher=Object.assign({},ziel.plaetze);
      ziel.plaetze[key]=neu;
      if(plaetzeSum(ziel)<1){
        Toast.show('Mindestens ein Platz muss bleiben.',{type:'warn'});
        ziel.plaetze=vorher;inputEl.value=vorher[key]||'';return;
      }
      syncBegleitungen(ziel);
    }else{
      ziel.pass[key]=neu;
    }
    if(ziel._demo)delete ziel._demo;
    const shw=showById(ziel.showId);
    if(shw&&shw.final&&ziel.status==='final')shw.changedSinceFinal=true;
    save();
    setTimeout(()=>{
      const akt=document.activeElement;
      const merk=(akt&&akt.id)?akt.id:null;
      render();
      if(merk){const e=document.getElementById(merk);if(e){e.focus();if(e.select)e.select();}}
    },0);
  }

  function paint(){
    chips.innerHTML='';
    const addChip=(label,active,on)=>{const b=ael('button',active?'on':null,label);b.onclick=on;chips.appendChild(b);};
    [['angefragt','angefragt'],['genehmigt','genehmigt'],['abgelehnt','abgelehnt'],['final','final']].forEach(([v,l])=>
      addChip(l,glFilter.status.has(v),()=>{tgl(glFilter.status,v);paint();}));
    PLATZ.concat(PASS).forEach(k=>addChip(k.sp,glFilter.kat.has(k.id),()=>{tgl(glFilter.kat,k.id);paint();}));
    [...new Set(all.map(g=>g.gruppeId))].forEach(id=>{const gr=grpById(id);if(gr)addChip(gr.name,glFilter.grp.has(id),()=>{tgl(glFilter.grp,id);paint();});});
    addChip('nur Aftershow',glFilter.aftershow,()=>{glFilter.aftershow=!glFilter.aftershow;paint();});
    addChip('nur Nachtrag',glFilter.nachtrag,()=>{glFilter.nachtrag=!glFilter.nachtrag;paint();});
    addChip('Mailout offen',glFilter.offen,()=>{glFilter.offen=!glFilter.offen;paint();});
    sortRow.innerHTML='';
    [['name','Name'],['status','Status'],['kat','Platzart'],['neu','Zuletzt']].forEach(([v,l])=>{
      const b=ael('button',glFilter.sort===v?'on':null,l);b.onclick=()=>{glFilter.sort=v;paint();};sortRow.appendChild(b);});
    sortRow.appendChild(ael('span','sorttrenn','Ansicht:'));
    [['tabelle','Tabelle'],['karten','Karten']].forEach(([v,l])=>{
      const b=ael('button',prefs.ansicht===v?'on':null,l);
      b.onclick=()=>{prefs.ansicht=v;savePrefs();paint();};sortRow.appendChild(b);});
    if(prefs.ansicht==='tabelle'){
      sortRow.appendChild(ael('span','sorttrenn','Spalten:'));
      [['alle','Alle'],['benutzt','Nur benutzte']].forEach(([v,l])=>{
        const b=ael('button',(prefs.spalten||'alle')===v?'on':null,l);
        b.title=(v==='benutzt')?'Blendet leere Mengenspalten aus — wie ausgeblendete Spalten in der bisherigen Tabelle.':'Zeigt alle Spalten der Vorlage.';
        b.onclick=()=>{prefs.spalten=v;savePrefs();paint();};sortRow.appendChild(b);});
    }
    wrap.innerHTML='';
    const filtered=sortList(all.filter(matches));
    lastFiltered=filtered;
    // Auswahl auf sichtbare (gefilterte) Menge begrenzen
    const vis=new Set(filtered.map(g=>g.id));
    [...bulkSel].forEach(id=>{if(!vis.has(id))bulkSel.delete(id);});
    cnt.textContent=filtered.length+' von '+all.length+' angezeigt';
    if(!filtered.length){const h=ael('div','hint');h.textContent='Keine Treffer für die aktuelle Auswahl.';wrap.appendChild(h);}
    else if(prefs.ansicht==='karten')filtered.forEach(g=>wrap.appendChild(guestCard(g)));
    else wrap.appendChild(guestTable(filtered));
    updateBulkBar();
  }
  inp.oninput=()=>{glFilter.q=inp.value;paint();};
  xb.onclick=()=>{glFilter.q='';inp.value='';paint();inp.focus();};
  paint();
  return sec;
}

/* V8 Tour-Statistik (inkl. Snapshots gelöschter Shows) */
function collectStats(){
  const grp={},per={},stadt={};
  let nachtragGesamt=0;
  const ensure=(o,id)=>{if(!o[id])o[id]={genehmigt:0,eingecheckt:0};return o[id];};
  // Live
  state.gaeste.forEach(g=>{
    if(g.nachtrag)nachtragGesamt++;
    if(!APPROVED(g))return;
    const pers=personsPlanned(g),ein=personsCheckedIn(g);
    const a=ensure(grp,g.gruppeId);a.genehmigt+=pers;a.eingecheckt+=ein;
    const b=ensure(per,g.einladenderId);b.genehmigt+=pers;b.eingecheckt+=ein;
  });
  state.gaeste.forEach(g=>{
    if(!APPROVED(g))return;
    const sh=showById(g.showId);if(!sh)return;
    stadt[sh.stadt]=(stadt[sh.stadt]||0)+personsPlanned(g);
  });
  // Snapshots
  state.shows.forEach(sh=>{
    const snap=sh.statistikSnapshot;if(!snap)return;
    nachtragGesamt+=snap.nachtraege||0;
    Object.entries(snap.gruppen||{}).forEach(([id,v])=>{const a=ensure(grp,id);a.genehmigt+=v.genehmigt||0;a.eingecheckt+=v.eingecheckt||0;});
    Object.entries(snap.einladende||{}).forEach(([id,v])=>{const a=ensure(per,id);a.genehmigt+=v.genehmigt||0;a.eingecheckt+=v.eingecheckt||0;});
    if(snap.stadt)stadt[snap.stadt]=(stadt[snap.stadt]||0)+(snap.personen||0);
  });
  return {grp,per,stadt,nachtragGesamt};
}

/* V9 Datenschutz */
function makeSnapshot(sh){
  const snap={stadt:sh.stadt,personen:0,nachtraege:0,gruppen:{},einladende:{}};
  // Token nur als anonymes Aggregat (kein Personenbezug im Snapshot)
  const tks=(state.tokens||[]).filter(t=>t.showId===sh.id);
  snap.tokens={gesamt:tks.length,eingeloest:tks.filter(t=>t.status==='eingeloest').length,offen:tks.filter(t=>t.status==='offen').length};
  const ens=(o,id)=>{if(!o[id])o[id]={genehmigt:0,eingecheckt:0,nachtraege:0};return o[id];};
  state.gaeste.filter(g=>g.showId===sh.id).forEach(g=>{
    if(g.nachtrag)snap.nachtraege++;
    if(!APPROVED(g))return;
    const pers=personsPlanned(g),ein=personsCheckedIn(g);
    snap.personen+=pers;
    const a=ens(snap.gruppen,g.gruppeId);a.genehmigt+=pers;a.eingecheckt+=ein;if(g.nachtrag)a.nachtraege++;
    const b=ens(snap.einladende,g.einladenderId);b.genehmigt+=pers;b.eingecheckt+=ein;if(g.nachtrag)b.nachtraege++;
  });
  return snap;
}

  v.appendChild(sechead('Mein Kontingent · '+p.name,grp?grp.name:''));
  const kwrap=ael('div','sec');
  state.shows.forEach(s=>{
    if(s.geloescht)return;
    const q=personQuota(p.id,s.id);
    const t=tallyPersonShow(p.id,s.id);
    const vergeben=t.beantragt+t.genehmigt;
    const c=ael('div','card');

    else if(s.final){const d=ael('span','badge b-final','final');d.style.marginLeft='6px';nm.appendChild(d);}
    main.appendChild(nm);
    const meta=ael('div','small muted');meta.textContent=vergeben+' von '+(q==null?'∞':q)+' vergeben (beantragt+genehmigt, Personen)';
    main.appendChild(meta);
    main.appendChild(bar(vergeben,q));
    r.appendChild(main);
    c.appendChild(r);
    kwrap.appendChild(c);
  });
  v.appendChild(kwrap);

  // Eigene Gäste mit Ampel
  const mine=state.gaeste.filter(g=>g.einladenderId===p.id)
    .sort((a,b)=>b.createdAt-a.createdAt);
  v.appendChild(sechead('Meine Gäste',mine.length+' Anträge'));

  mine.forEach(g=>{

    const r=ael('div','row');

    const nm=ael('div');nm.style.fontWeight='700';
    nm.textContent=guestName(g)+(personsPlanned(g)>1?' +'+(personsPlanned(g)-1):'');
    if(g.nachtrag){const d=ael('span','badge b-tape','NACHTRAG');d.style.marginLeft='6px';d.title='Nach dem Redaktionsschluss (Deadline) angelegt oder geändert — Liste ggf. neu exportieren.';nm.appendChild(d);}
    main.appendChild(nm);
    const meta=ael('div','small muted');
    meta.textContent=(sh?(sh.stadt||''):'')+' · '+platzText(g)+' · '+g.status+(g.aftershow?' · Aftershow-Zugang':'');
    main.appendChild(meta);
    r.appendChild(main);
    // Bearbeiten nur solange nicht final/abgelehnt und vor Deadline
    if(sh&&!sh.final&&g.status!=='abgelehnt'&&!deadlinePassed(sh)){
      const be=ael('button','smallbtn','Bearb.');be.onclick=()=>openGuestDlg(g.id,{einladen:true});
      r.appendChild(be);

    gwrap.appendChild(c);
