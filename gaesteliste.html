  v.appendChild(gwrap);

  const anyOpen=state.shows.some(s=>!s.final&&!s.geloescht&&!deadlinePassed(s));
  if(!anyOpen){
    const h=ael('div','hint warn');h.textContent='Redaktionsschluss erreicht — bitte ans Tourmanagement wenden.';v.appendChild(h);
  }
  setTools([{label:'+ Gast',cls:'primary',disabled:!anyOpen,
    on:()=>anyOpen?openGuestDlg(null,{einladen:true}):Toast.show('Redaktionsschluss — bitte ans Tourmanagement wenden.',{type:'warn'})}]);
}

/* ================= Modus Einlass ================= */
let einlassSearch='';
let einlassFilter='';   // Platzart/Zusatzausweis-Kennung oder ''
let einlassLastList=[]; // F2.5 aktuell gefilterte Einlass-Treffer
function einlassEnterCheckin(sh){
  const q=einlassSearch.trim().toLowerCase();
  if(!q)return;
  if(einlassLastList.length!==1){Toast.show(einlassLastList.length+' Treffer — bitte weiter eingrenzen.',{type:'info'});return;}
  const g=einlassLastList[0];
  if(g.checkinAt){Toast.show(guestName(g)+' ist bereits eingecheckt.',{type:'info'});return;}
  checkinMain(g,sh);
}
function renderEinlass(){
  const v=$('view');
  const finals=state.shows.filter(s=>s.final&&!s.geloescht);
  setTools([{label:'JSON-Export (Check-in-Stände sichern)',on:jsonExport}]);
  if(!finals.length){
    v.appendChild(mkHint('Noch keine finalisierte Show. Im Modus „Verwaltung“ eine Liste finalisieren.'));
    return;
  }
  // Show wählen: heute bevorzugt. Eigene Auswahl, damit die aktive Show der Verwaltung nicht überschrieben wird.
  const today=todayISO();
  let cur=finals.find(s=>s.id===state.ui.einlassShowId&&s.final&&!s.geloescht);
  if(!cur)cur=finals.find(s=>s.id===state.ui.aktiveShowId&&s.final&&!s.geloescht);
  // Sonst: heute, dann die nächste kommende Show, erst zuletzt eine aus dem Archiv.
  if(!cur)cur=finals.find(s=>s.datum===today)||showsKommend(finals)[0]||showsArchiv(finals)[0]||finals[0];
  state.ui.einlassShowId=cur.id;

  const selWrap=ael('div','sec');
  const f=ael('div','f');f.appendChild(ael('label',null,'Show (nur finalisierte)'));
  const sel=document.createElement('select');
  fillShowSelect(sel,finals,cur.id,
    s=>fmtDateShort(s.datum)+' · '+(s.stadt||'')+' · v'+s.finalVersion+(s.datum===today?' · HEUTE':''));
  sel.onchange=()=>{state.ui.einlassShowId=sel.value;einlassSearch='';einlassFilter='';save();render();};
  f.appendChild(sel);selWrap.appendChild(f);
  v.appendChild(selWrap);

  // Suchfeld
  const sb=ael('div','searchbar');
  const si=document.createElement('input');si.placeholder='Suchen … (z. B. „mü“ → Müller, auch ohne Umlaute)';si.value=einlassSearch;
  si.oninput=()=>{einlassSearch=si.value;buildEinlassList(cur);};
  si.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();einlassEnterCheckin(cur);}};
  sb.appendChild(si);v.appendChild(sb);

  // Kopf: Zähler + Filterchips
  const top=ael('div','eltop');
  const cnt=ael('div','cnt');cnt.id='elCnt';cnt.setAttribute('aria-live','polite');top.appendChild(cnt);
  v.appendChild(top);
  const chips=ael('div','filterchips');
  const mkChip=(id,label)=>{const b=ael('button',einlassFilter===id?'on':null,label);
    b.onclick=()=>{einlassFilter=id;buildEinlassList(cur);
      chips.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
    return b;};
  chips.appendChild(mkChip('','Alle'));
  PLATZ.concat(PASS).forEach(k=>chips.appendChild(mkChip(k.id,k.sp)));
  v.appendChild(chips);

  const listc=ael('div');listc.id='elList';v.appendChild(listc);
  buildEinlassList(cur);
}
function mkHint(t){const h=ael('div','hint');h.textContent=t;return h;}
/* F1.7 Erklär-Tooltips — "?"-Icon mit title + kleinem Popover (Toast) */
function mkTip(text){
  const b=document.createElement('button');b.type='button';b.className='tipbtn';
  b.title=text;b.setAttribute('aria-label','Erklärung: '+text);b.textContent='?';
  b.onclick=(e)=>{e.preventDefault();e.stopPropagation();Toast.show(text,{type:'info',ms:7000});};
  return b;
}

function buildEinlassList(sh){
  const listc=$('elList');if(!listc)return;listc.innerHTML='';
  let list=state.gaeste.filter(g=>g.showId===sh.id&&g.status==='final');
  // Zähler (Personen-genau, über gesamte finale Liste)
  let totalP=0,inP=0;
  list.forEach(g=>{totalP+=personsPlanned(g);inP+=personsCheckedIn(g);});
  const cnt=$('elCnt');if(cnt)cnt.textContent='Eingecheckt '+inP+' / '+totalP+' Personen';
  // Filter
  const q=einlassSearch.trim();
  if(einlassFilter)list=list.filter(g=>(PLATZ_IDS.indexOf(einlassFilter)>=0?platzWert(g,einlassFilter):passWert(g,einlassFilter))>0);
  const compHit=g=>!!q&&(g.begleitungen||[]).some(b=>suchTreffer(b.name||'',q));
  if(q)list=list.filter(g=>suchTreffer(guestName(g),q)||suchTreffer(g.vorname||'',q)||compHit(g));
  list.sort((a,b)=>((a.nachname||'')+a.vorname).toLowerCase().localeCompare(((b.nachname||'')+b.vorname).toLowerCase(),'de'));
  einlassLastList=list;
  if(q){const hc=ael('div','elhitcount');hc.textContent=list.length+' Treffer'+(list.length===1?' · Enter = Check-in':'');listc.appendChild(hc);}
  if(!list.length){listc.appendChild(mkHint('Kein Treffer.'));return;}
  list.forEach(g=>{
    const kat=hauptPlatz(g);
    const row=ael('div','elrow'+(g.checkinAt?' in':''));
    row.style.borderLeftColor=kat.farbe;
    const nm=ael('div','elname');
    nm.textContent=guestName(g)+(personsPlanned(g)>1?' +'+(personsPlanned(g)-1):'');
    row.appendChild(nm);
    const meta=ael('div','elmeta');meta.textContent=platzText(g);row.appendChild(meta);
    const chk=ael('div','elcheck'+(personsCheckedIn(g)<personsPlanned(g)&&personsCheckedIn(g)>0?' part':''));
    chk.textContent=personsCheckedIn(g)+' von '+personsPlanned(g)+' da';
    row.appendChild(chk);
    // Einzeltap = Check-in bzw. Warnung; Doppeltap = Rücknahme (ohne vorherige Doppel-Alerts)
    row.onclick=()=>{
      if(!g.checkinAt){checkinMain(g,sh);return;}
      if(row._t){clearTimeout(row._t);row._t=null;undoCheckinMain(g,sh);return;}
      row._t=setTimeout(()=>{row._t=null;alert('⚠ '+guestName(g)+' bereits eingecheckt '+hhmm(g.checkinAt)+'.\nRücknahme per Doppelklick.');},260);
    };
    listc.appendChild(row);
    // Begleitungen einzeln
    if(g.begleitungen&&g.begleitungen.length){
      const comp=ael('div','elcomp');
      g.begleitungen.forEach((b,idx)=>{
        const cb=ael('button','compbtn'+(b.checkinAt?' in':'')+((q&&(b.name||'').toLowerCase().includes(q))?' qhit':''));
        const lab=ael('span',null,(b.name&&b.name.trim())?b.name:('Begleitung '+(idx+1)));
        const t=ael('span','t',b.checkinAt?('da '+hhmm(b.checkinAt)):'antippen');
        cb.appendChild(lab);cb.appendChild(t);
        cb.onclick=()=>{
          const bb=g.begleitungen[idx];
          if(!bb||!bb.checkinAt){checkinComp(g,idx,sh);return;}
          if(cb._t){clearTimeout(cb._t);cb._t=null;undoCheckinComp(g,idx,sh);return;}
          cb._t=setTimeout(()=>{cb._t=null;alert('⚠ Begleitung bereits eingecheckt '+hhmm(bb.checkinAt)+'.\nRücknahme per Doppelklick.');},260);
        };
        comp.appendChild(cb);
      });
      listc.appendChild(comp);
    }
  });
}
function checkinMain(g,sh){
  if(g.checkinAt){
    // Nur Warnung — keine versehentliche Rücknahme. Rücknahme separat per Doppelklick.
    alert('⚠ '+guestName(g)+' bereits eingecheckt '+hhmm(g.checkinAt)+'.\nRücknahme per Doppelklick.');
    return;
  }
  const gid=g.id,shid=sh.id;
  withUndo('Check-in: '+guestName(g),
    ()=>{const gg=state.gaeste.find(x=>x.id===gid);if(gg)gg.checkinAt=Date.now();},
    ()=>{const s=showById(shid);if(s)buildEinlassList(s);});
}
function undoCheckinMain(g,sh){
  if(!g.checkinAt)return;
  const gid=g.id,shid=sh.id,name=guestName(g);
  withUndo('Check-in zurückgenommen: '+name,
    ()=>{const gg=state.gaeste.find(x=>x.id===gid);if(gg)gg.checkinAt=null;},
    ()=>{const s=showById(shid);if(s)buildEinlassList(s);});
}
function checkinComp(g,idx,sh){
  const b=g.begleitungen[idx];if(!b)return;
  if(b.checkinAt){
    alert('⚠ Begleitung bereits eingecheckt '+hhmm(b.checkinAt)+'.\nRücknahme per Doppelklick.');
    return;
  }
  const gid=g.id,shid=sh.id;
  withUndo('Check-in: Begleitung',
    ()=>{const gg=state.gaeste.find(x=>x.id===gid);if(gg&&gg.begleitungen[idx])gg.begleitungen[idx].checkinAt=Date.now();},
    ()=>{const s=showById(shid);if(s)buildEinlassList(s);});
}
function undoCheckinComp(g,idx,sh){
  const b=g.begleitungen[idx];if(!b||!b.checkinAt)return;
  const gid=g.id,shid=sh.id;
  withUndo('Check-in Begleitung zurückgenommen',
    ()=>{const gg=state.gaeste.find(x=>x.id===gid);if(gg&&gg.begleitungen[idx])gg.begleitungen[idx].checkinAt=null;},
    ()=>{const s=showById(shid);if(s)buildEinlassList(s);});
}

/* ================= Dialog-Helfer ================= */
let modalReturnFocus=null;
function modal(buildFn){
  const dlg=document.createElement('dialog');
  dlg.setAttribute('aria-modal','true');
  $('dlgs').appendChild(dlg);
  modalReturnFocus=document.activeElement;
  dlg.addEventListener('close',()=>{
    dlg.remove();
    if(modalReturnFocus&&typeof modalReturnFocus.focus==='function')try{modalReturnFocus.focus();}catch(e){}
    modalReturnFocus=null;
  });
  buildFn(dlg,()=>dlg.close());
  const h2=dlg.querySelector('h2');
  if(h2){if(!h2.id)h2.id='dlgtitle-'+uid('t');dlg.setAttribute('aria-labelledby',h2.id);}
  // Fallback fuer sehr alte iOS-Safari (<15.4) ohne <dialog>.showModal()
  if(typeof dlg.showModal==='function')dlg.showModal();else dlg.setAttribute('open','');
  return dlg;
}
function selectFrom(items,valFn,labFn,cur){
  const s=document.createElement('select');
  items.forEach(it=>{const o=document.createElement('option');o.value=valFn(it);o.textContent=labFn(it);
    if(valFn(it)===cur)o.selected=true;s.appendChild(o);});
  return s;
}

/* ================= Gast-Dialog ================= */
/* ================= Gast-Dialog =================
   Feldreihenfolge exakt wie die Spalten der bisherigen Gästelisten-Tabelle:
   Name · Vorname · E-Mail · Steh · Sitz · Aftershow · Kat 4 · AAA · F/F · Foto ·
   Referenz/Medium · c/o · Pool · Notiz. */
function openGuestDlg(id,opts){
  opts=opts||{};
  const einladen=!!opts.einladen;
  const existing=id?state.gaeste.find(g=>g.id===id):null;

  // Kontext: c/o (Einladender) + Pool
  let einlId=existing?existing.einladenderId:(einladen?state.ui.werBinIch:(state.einladende[0]?state.einladende[0].id:null));
  let gruppeId=existing?existing.gruppeId:(pById(einlId)?pById(einlId).gruppeId:(state.gruppen[0]?state.gruppen[0].id:null));

  // Arbeitskopie der Mengen
  const plaetze=existing?Object.assign(leerePlaetze(),existing.plaetze):leerePlaetze();
  const paesse =existing?Object.assign(leerePaesse(),existing.pass):leerePaesse();
  if(!existing)plaetze.steh=1;

  modal((dlg,close)=>{
    dlg.appendChild(ael('h2',null,existing?'Zeile bearbeiten':'Neue Zeile'));
    const warnBox=ael('div');dlg.appendChild(warnBox);

    // --- Name / Vorname (Reihenfolge wie in der Tabelle) ---
    const f2=ael('div','f2');
    const fn=ael('div','f');fn.appendChild(ael('label',null,'Name'));
    const inp=document.createElement('input');inp.value=existing?existing.nachname||'':'';fn.appendChild(inp);
    const fv=ael('div','f');fv.appendChild(ael('label',null,'Vorname'));
    const iv=document.createElement('input');iv.value=existing?existing.vorname||'':'';fv.appendChild(iv);
    f2.appendChild(fn);f2.appendChild(fv);dlg.appendChild(f2);

    // --- E-Mail ---
    const fem=ael('div','f');
    const emLb=ael('label',null,'E-Mail');
    emLb.appendChild(mkTip('Wie in der Tabelle. Wird zusätzlich für den Ticket-Zugang und den Mailout gebraucht.'));
    fem.appendChild(emLb);
    const iem=document.createElement('input');iem.type='email';iem.placeholder='name@beispiel.de';
    iem.value=existing?existing.email||'':'';fem.appendChild(iem);dlg.appendChild(fem);

    // --- Plätze (zählen auf das Gast-Limit) ---
    const erlaubt=()=>{
      const grp=grpById(gruppeId);
      if(einladen&&grp&&grp.erlaubtePlatzarten&&grp.erlaubtePlatzarten.length)
        return PLATZ.filter(k=>grp.erlaubtePlatzarten.indexOf(k.id)>=0);
      return PLATZ;
    };
    const plLb=ael('div','f');
    const plLab=ael('label',null,'Plätze — zählen auf das Gast-Limit');
    plLab.appendChild(mkTip('Wie in der Tabelle: verbraucht = Steh + Sitz + Aftershow + Kat 4.'));
    plLb.appendChild(plLab);
    const plGrid=ael('div','mgrid');plLb.appendChild(plGrid);dlg.appendChild(plLb);

    // --- Zusatzausweise ---
    const paLb=ael('div','f');
    const paLab=ael('label',null,'Zusatzausweise — zählen nicht auf das Gast-Limit');
    paLab.appendChild(mkTip('AAA, F/F und Foto laufen in der Tabelle in eigenen Spalten und werden nicht auf das Gast-Limit angerechnet.'));
    paLb.appendChild(paLab);
    const paGrid=ael('div','mgrid');paLb.appendChild(paGrid);dlg.appendChild(paLb);

    const summe=ael('div','sumline');dlg.appendChild(summe);

    // --- Namen der Personen (aus der Platzsumme) ---
    let compNames=existing?existing.begleitungen.map(b=>b.name||''):[];
    const compBox=ael('div');dlg.appendChild(compBox);

    function persons(){let n=0;PLATZ_IDS.forEach(k=>n+=plaetze[k]||0);return n;}
    function renderComp(){
      compBox.innerHTML='';
      const n=Math.max(0,persons()-1);
      compNames.length=n;
      if(!n)return;
      const h=ael('div','small muted');h.style.margin='2px 0 6px';
      h.textContent='Namen der weiteren '+n+' Person'+(n===1?'':'en')+' — für harte Personalisierung und den Einlass:';
      compBox.appendChild(h);
      for(let i=0;i<n;i++){
        const cf=ael('div','f');cf.appendChild(ael('label',null,'Person '+(i+2)));
        const ci=document.createElement('input');ci.value=compNames[i]||'';ci.placeholder='leer = ohne Namen';
        ci.oninput=()=>{compNames[i]=ci.value;};
        cf.appendChild(ci);compBox.appendChild(cf);
      }
    }
    function updSum(){
      const n=persons();
      summe.textContent='Personen gesamt: '+n+'  ·  '+platzText({plaetze:plaetze,pass:paesse});
      summe.classList.toggle('warn',n<1);
      renderComp();
    }
    function zahlFeld(box,liste,ziel){
      box.innerHTML='';
      liste.forEach(k=>{
        const c=ael('div','mcell');
        c.appendChild(ael('span','ml',k.sp));
        const i=document.createElement('input');i.type='number';i.min='0';i.step='1';
        i.value=ziel[k.id]||0;i.setAttribute('aria-label',k.sp);
        i.max=String(MAX_MENGE);
        i.oninput=()=>{ziel[k.id]=menge(i.value);updSum();};
        i.onblur=()=>{i.value=ziel[k.id]||0;};
        c.appendChild(i);box.appendChild(c);
      });
    }

    // --- Referenz/Medium ---
    const fref=ael('div','f');
    const refLb=ael('label',null,'Referenz/Medium');
    refLb.appendChild(mkTip('Wie in der Tabelle: Medium, Partner oder Anlass der Einladung.'));
    fref.appendChild(refLb);
    const iref=document.createElement('input');iref.value=existing?existing.referenz||'':'';
    iref.placeholder='z. B. Musikexpress, Sponsor, Support';fref.appendChild(iref);dlg.appendChild(fref);

    // --- c/o (Einladender) + Pool ---
    if(!einladen){
      const fg=ael('div','f');
      const gLb=ael('label',null,'Pool (immer auswählen)');
      gLb.appendChild(mkTip('Pflichtspalte der Tabelle — sie steuert den Kontingentverbrauch im Kopfblock.'));
      fg.appendChild(gLb);
      const sg=selectFrom(state.gruppen,g=>g.id,g=>g.name,gruppeId);
      const fe=ael('div','f');fe.appendChild(ael('label',null,'c/o — auf wen läuft der Gast'));
      const se=document.createElement('select');
      function fillEinl(){
        se.innerHTML='';
        state.einladende.filter(p=>p.gruppeId===gruppeId).forEach(p=>{
          const o=document.createElement('option');o.value=p.id;o.textContent=p.name;if(p.id===einlId)o.selected=true;se.appendChild(o);});
        if(!se.value){const first=state.einladende.find(p=>p.gruppeId===gruppeId);einlId=first?first.id:null;}else einlId=se.value;
      }
      sg.onchange=()=>{gruppeId=sg.value;fillEinl();zahlFeld(plGrid,erlaubt(),plaetze);updSum();};
      se.onchange=()=>{einlId=se.value;};
      fg.appendChild(sg);fe.appendChild(se);dlg.appendChild(fg);dlg.appendChild(fe);
      fillEinl();
    }else{
      const info=ael('div','small muted');const grp=grpById(gruppeId);
      info.textContent='Als '+(pById(einlId)?pById(einlId).name:'—')+(grp?' · Pool '+grp.name:'');
      info.style.marginBottom='8px';dlg.appendChild(info);
    }

    zahlFeld(plGrid,erlaubt(),plaetze);
    zahlFeld(paGrid,PASS,paesse);
    updSum();

    // --- Show ---
    const fsh=ael('div','f');fsh.appendChild(ael('label',null,'Show'));
    const avail=state.shows.filter(s=>!s.geloescht&&(einladen?(!s.final&&!deadlinePassed(s)):true));
    const shList=avail.length?avail:state.shows;
    const ssh=fillShowSelect(document.createElement('select'),shList,
      existing?existing.showId:(aktiveShow()?aktiveShow().id:(showsKommend(shList)[0]?showsKommend(shList)[0].id:null)),
      s=>fmtDateShort(s.datum)+' · '+(s.stadt||''));
    fsh.appendChild(ssh);dlg.appendChild(fsh);

    // --- Aftershow-Zugang zusätzlich (in der Tabelle nur als Notiz führbar) ---
    const fas=ael('div','f');
    const asWrap=ael('label',null,null);asWrap.style.display='flex';asWrap.style.alignItems='center';asWrap.style.gap='8px';
    asWrap.style.textTransform='none';asWrap.style.letterSpacing='0';asWrap.style.fontSize='14px';
    const asCb=document.createElement('input');asCb.type='checkbox';asCb.style.width='auto';asCb.checked=existing?existing.aftershow:false;
    asWrap.appendChild(asCb);asWrap.appendChild(document.createTextNode('Aftershow-Zugang zusätzlich (Gast sieht auch die Show)'));
    fas.appendChild(asWrap);
    function updAfter(){const g=grpById(gruppeId);const ok=!einladen||(g&&g.aftershowErlaubt);fas.style.display=ok?'':'none';if(!ok)asCb.checked=false;}
    updAfter();dlg.appendChild(fas);

    // --- Notiz (nur Verwaltung) ---
    let inNote=null;
    if(!einladen){
      const fnt=ael('div','f');fnt.appendChild(ael('label',null,'Notiz'));
      inNote=document.createElement('textarea');inNote.value=existing?existing.notiz||'':'';fnt.appendChild(inNote);dlg.appendChild(fnt);
    }

    // --- Doppelt-Warnung live ---
    function checkDup(){
      warnBox.innerHTML='';
      const key=normName(iv.value,inp.value);if(!key)return;
      const showId=ssh.value;
      const dup=state.gaeste.find(o=>o.id!==id&&o.showId===showId&&normName(o.vorname,o.nachname)===key);
      if(dup){const w=ael('div','dlgwarn');const pn=pById(dup.einladenderId);
        w.textContent='⚠ Name steht schon auf dieser Liste — c/o: '+(pn?pn.name:'—')+'. Anlegen trotzdem möglich.';
        warnBox.appendChild(w);}
    }
    iv.oninput=checkDup;inp.oninput=checkDup;ssh.onchange=checkDup;checkDup();

    // --- Knöpfe ---
    const btns=ael('div','dlgbtns');
    if(existing&&!einladen){const del=ael('button','del','Löschen');
      del.onclick=()=>{const gid=id,nm=guestName(existing);close();withUndo('Zeile „'+nm+'“ gelöscht.',()=>{state.gaeste=state.gaeste.filter(g=>g.id!==gid);state.tokens=(state.tokens||[]).filter(t=>t.gastRef!==gid);});};
      btns.appendChild(del);}
    const cancel=ael('button',null,'Abbrechen');cancel.onclick=close;btns.appendChild(cancel);
    const savb=ael('button','save','Speichern');
    savb.onclick=()=>{
      const vn=iv.value.trim(),nn=inp.value.trim();
      if(!vn&&!nn){alert('Bitte mindestens einen Namen angeben.');return;}
      const em=iem.value.trim();
      if(em&&!EMAIL_RE.test(em)){alert('Die E-Mail-Adresse sieht nicht gültig aus. Bitte prüfen oder Feld leer lassen.');return;}
      const tp=persons();
      if(tp<1){alert('Bitte mindestens einen Platz eintragen (Steh, Sitz, Aftershow oder Kat 4).');return;}
      const zus=PASS_IDS.reduce((s,k)=>s+(paesse[k]||0),0);
      if(zus>tp&&!confirm('Es sind mehr Zusatzausweise ('+zus+') als Personen ('+tp+') eingetragen. Trotzdem speichern?'))return;
      const showId=ssh.value;const sh=showById(showId);
      if(!showId||!sh){Toast.show('Bitte zuerst eine Show anlegen/auswählen.',{type:'warn'});return;}
      const begl=[];
      for(let i=0;i<tp-1;i++){
        const old=existing&&existing.begleitungen[i];
        begl.push({name:(compNames[i]||'').trim(),checkinAt:old?old.checkinAt:null});
      }
      if(existing){
        // Bei bereits genehmigten/finalen Zeilen Kontingent + Gast-Limit erneut prüfen —
        // keine stille Überbuchung, wenn Plätze erhöht oder die Show gewechselt wird.
        if(existing.status==='genehmigt'||existing.status==='final'){
          const sumApp=pred=>{let s=0;state.gaeste.forEach(o=>{if(o.id===existing.id)return;if(!APPROVED(o))return;if(pred(o))s+=personsPlanned(o);});return s;};
          const gAfter=sumApp(o=>o.showId===showId&&o.gruppeId===gruppeId)+tp;
          const pAfter=sumApp(o=>o.showId===showId&&o.einladenderId===einlId)+tp;
          const dAfter=sumApp(o=>o.showId===showId)+tp;
          const gq=grpQuota(gruppeId,showId),pq=personQuota(einlId,showId),dk=sh?sh.deckel:null;
          const probs=[];
          if(gq!=null&&gAfter>gq)probs.push('Pool-Kontingent ('+gAfter+'/'+gq+')');
          if(pq!=null&&pAfter>pq)probs.push('c/o-Kontingent ('+pAfter+'/'+pq+')');
          if(dk!=null&&dAfter>dk)probs.push('Gast-Limit ('+dAfter+'/'+dk+')');
          if(probs.length&&!confirm('Änderung überschreitet: '+probs.join(', ')+'.\nTrotzdem übernehmen?'))return;
        }
        if(existing.status==='final'&&sh&&sh.final)sh.changedSinceFinal=true;
        Object.assign(existing,{vorname:vn,nachname:nn,email:em,begleitungen:begl,
          plaetze:Object.assign(leerePlaetze(),plaetze),pass:Object.assign(leerePaesse(),paesse),
          referenz:iref.value.trim(),showId,einladenderId:einlId,gruppeId,
          aftershow:asCb.checked,notiz:inNote?inNote.value:existing.notiz});
        if(existing._demo)delete existing._demo; // vom Nutzer bearbeitet = Echtdatensatz
        save();close();render();return;
      }
      // Neuanlage
      const g={id:uid('g'),vorname:vn,nachname:nn,email:em,begleitungen:begl,
        plaetze:Object.assign(leerePlaetze(),plaetze),pass:Object.assign(leerePaesse(),paesse),
        referenz:iref.value.trim(),einladenderId:einlId,gruppeId,showId,
        status:'angefragt',checkinAt:null,notiz:inNote?inNote.value:'',
        aftershow:asCb.checked,nachtrag:false,autoGenehmigt:false,mailoutAt:null,createdAt:Date.now()};
      if(sh&&sh.final){
        if(!confirm('Show ist finalisiert — Nachtrag nach Finalisierung wirklich anlegen? (Liste neu exportieren!)')){return;}
        g.nachtrag=true;g.status='final';sh.changedSinceFinal=true;
      }else if(sh&&deadlinePassed(sh)){
        if(!confirm('Nachtrag nach Redaktionsschluss — wirklich anlegen?')){return;}
        g.nachtrag=true;
      }
      state.gaeste.push(g);
      if(g.status==='angefragt')tryAutoApprove(g);
      save();close();render();
    };
    btns.appendChild(savb);dlg.appendChild(btns);
    setTimeout(()=>inp.focus(),0);
  });
}

/* ================= Exporte ================= */
const BOM='﻿';
function csvField(v){
  v=String(v==null?'':v);
  // CSV-Formel-Injection entschaerfen: Felder, die mit = + - @ (oder Tab/CR) beginnen,
  // wuerden von Excel/Sheets als Formel ausgefuehrt -> mit ' neutralisieren.
  if(/^[=+\-@\t\r]/.test(v))v="'"+v;
  if(/[;"\n\r]/.test(v))return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function csvRows(rows){return rows.map(r=>r.map(csvField).join(';')).join('\r\n');}
function download(name,content,mime){
  const blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);
}
function fname(sh,typ,ext){
  return 'gaesteliste_'+slug(state.kuenstler)+'_'+slug(sh.stadt)+'_'+(sh.datum||'')+'_v'+sh.finalVersion+'_'+stampNow()+'_'+typ+'.'+ext;
}
function splitName(full){
  const s=(full||'').trim();if(!s)return {v:'',n:''};
  const i=s.lastIndexOf(' ');
  if(i<0)return {v:'',n:s};
  return {v:s.slice(0,i).trim(),n:s.slice(i+1).trim()};
}
function finalGuests(sh){
  return state.gaeste.filter(g=>g.showId===sh.id&&g.status==='final')
    .sort((a,b)=>((a.nachname||'')+' '+a.vorname).toLowerCase().localeCompare(((b.nachname||'')+' '+b.vorname).toLowerCase(),'de'));
}
function guardFinal(sh){
  if(!sh){Toast.show('Keine Show gewählt.',{type:'warn'});return false;}
  if(!sh.final){Toast.show('Erst finalisieren — Abendkasse bekommt nie eine veraltete Version.',{type:'warn'});return false;}
  return true;
}

/* (b) CSV Abendkasse */
function exportAbendkasse(sh){
  if(!guardFinal(sh))return false;
  const rows=[['Name','Vorname','Personen','Plätze / Ausweise','c/o']];
  finalGuests(sh).forEach(g=>{
    rows.push([g.nachname||'',g.vorname||'',String(personsPlanned(g)),
      platzText(g),(pById(g.einladenderId)||{name:''}).name]);
  });
  download(fname(sh,'abendkasse','csv'),BOM+csvRows(rows),'text/csv;charset=utf-8');
  return true;
}

/* (e) CSV im Aufbau der bisherigen Gästelisten-Tabelle —
   Kopfblock (Zeilen 1–11), Spaltenüberschriften (Zeile 12), darunter die Zeilen.
   Damit lässt sich der Stand ohne Umgewöhnung in der gewohnten Tabelle weiterverwenden. */
function exportVorlage(sh){
  if(!sh){Toast.show('Keine Show gewählt.',{type:'warn'});return false;}
  const SP=22;                        // Spalten A bis V wie in der Vorlage
  const g=[];                         // Raster
  const setz=(z,sp,w)=>{while(g.length<=z)g.push(new Array(SP).fill(''));g[z][sp]=(w==null?'':String(w));};
  const alle=state.gaeste.filter(x=>x.showId===sh.id);
  const liste=(sh.final?alle.filter(x=>x.status==='final'):alle.filter(APPROVED))
    .sort((a,b)=>((a.nachname||'')+' '+a.vorname).toLowerCase().localeCompare(((b.nachname||'')+' '+b.vorname).toLowerCase(),'de'));
  const verbraucht=liste.reduce((s,x)=>s+personsPlanned(x),0);
  const daPers=liste.reduce((s,x)=>s+personsCheckedIn(x),0);
  const limit=(sh.deckel==null?null:+sh.deckel);

  setz(0,0,tourLabel());
  setz(1,0,'Datum');                setz(1,1,'Ort - Venue');
  setz(2,0,fmtDate(sh.datum));      setz(2,1,(sh.stadt||'')+(sh.venue?(' - '+sh.venue):''));
  setz(1,2,'Kap Steh');             setz(1,3,sh.kapSteh==null?'':sh.kapSteh);
  setz(2,2,'Kap Sitz');             setz(2,3,sh.kapSitz==null?'':sh.kapSitz);
  setz(3,2,'Family & Friends Bereich'); setz(3,3,sh.ffBereich||'');
  setz(1,8,'show:');                setz(1,9,daPers);
  setz(2,8,'no show:');             setz(2,9,Math.max(0,verbraucht-daPers));
  setz(4,8,'Gast Limit');           setz(4,9,limit==null?'':limit);
  setz(5,8,'verbraucht:');          setz(5,9,verbraucht);
  setz(6,8,'übrig:');               setz(6,9,limit==null?'':(limit-verbraucht));
  setz(5,0,'Kontakte für Rücksprachen:');
  sh.kontakte.forEach((k,i)=>{setz(6+i,0,k.rolle||'');setz(6+i,1,k.name||'');setz(6+i,2,k.mobil||'');});
  setz(1,11,'Kont');setz(1,12,'Pool');setz(1,13,'verbraucht');setz(1,14,'übrig');
  state.gruppen.forEach((gr,i)=>{
    const q=grpQuota(gr.id,sh.id);
    const v=liste.filter(x=>x.gruppeId===gr.id).reduce((s,x)=>s+personsPlanned(x),0);
    setz(2+i,11,q==null?'':q);setz(2+i,12,gr.name);setz(2+i,13,v);setz(2+i,14,q==null?'':(q-v));
  });
  setz(1,17,sh.vorjahrTitel||'GL Vorjahr');
  sh.vorjahr.forEach((v,i)=>{setz(2+i,16,v.label||'');setz(2+i,17,v.wert==null?'':v.wert);});
  // Zeile 11 (Index 10) = Summenzeile
  setz(10,0,daPers);setz(10,2,'total');
  PLATZ.forEach((pz,i)=>setz(10,4+i,spaltenSumme(liste,pz.id)));
  PASS.forEach((pz,i)=>setz(10,8+i,spaltenSumme(liste,pz.id)));
  // Zeile 12 (Index 11) = Spaltenüberschriften
  ['show','Name','Vorname','E-Mail','Steh','Sitz','Aftershow','Kat 4','AAA','F/F','Foto',
   'Referenz/Medium','c/o','Pool (IMMER AUSWÄHLEN)','Notiz','Mailout'].forEach((t,i)=>setz(11,i,t));
  // Datenzeilen ab Zeile 13 (Index 12)
  let letzteMail=-1;
  liste.forEach((x,i)=>{
    const z=12+i;
    setz(z,0,personsCheckedIn(x)>0?personsCheckedIn(x):'');
    setz(z,1,x.nachname||'');setz(z,2,x.vorname||'');setz(z,3,x.email||'');
    PLATZ.forEach((pz,k)=>{const w=platzWert(x,pz.id);setz(z,4+k,w?w:'');});
    PASS.forEach((pz,k)=>{const w=passWert(x,pz.id);setz(z,8+k,w?w:'');});
    setz(z,11,x.referenz||'');
    setz(z,12,(pById(x.einladenderId)||{name:''}).name);
    setz(z,13,(grpById(x.gruppeId)||{name:''}).name);
    setz(z,14,(x.notiz||'')+(x.aftershow?((x.notiz?' · ':'')+'Aftershow-Zugang'):''));
    if(x.mailoutAt)setz(z,15,fmtDate(new Date(x.mailoutAt).toISOString().slice(0,10)));
  });
  // Die gewohnte Merkzeile „Mailout bis hier versendet!“ nur, solange der Versand
  // vom Anfang der Liste an lückenlos durchläuft — sonst wäre sie irreführend.
  for(let i=0;i<liste.length;i++){if(!liste[i].mailoutAt)break;letzteMail=i;}
  if(letzteMail>=0)setz(12+letzteMail,15,'Mailout bis hier versendet!');
  download(fname(sh,'vorlage','csv'),BOM+csvRows(g),'text/csv;charset=utf-8');
  return true;
}

/* ================= Importvorlage: bestehende Gästeliste einlesen =================
   Liest genau den Aufbau, den der Export „(e) Tabelle im gewohnten Aufbau“ schreibt —
   und damit auch die bisher genutzte Gästelisten-Tabelle, wenn sie als CSV gespeichert wird.
   Rein additiv: vorhandene Gäste bleiben unangetastet, es kommen nur neue Zeilen dazu. */
const IMPORT_KOPF=['show','Name','Vorname','E-Mail','Steh','Sitz','Aftershow','Kat 4','AAA','F/F','Foto',
  'Referenz/Medium','c/o','Pool (IMMER AUSWÄHLEN)','Notiz','Mailout'];

/* Die Vorlage zum Herunterladen — gleicher Aufbau wie der Export, mit zwei Beispielzeilen. */
function importVorlageText(){
  const g=[];
  const setz=(z,sp,w)=>{while(g.length<=z)g.push(new Array(IMPORT_KOPF.length).fill(''));g[z][sp]=(w==null?'':String(w));};
  setz(0,0,'Importvorlage Gästeliste — bitte diese Datei mit der bestehenden Liste füllen und im Werkzeug einlesen.');
  setz(1,0,'Eine Zeile je Gast. Die Überschriftenzeile bitte stehen lassen. Die beiden Beispielzeilen werden beim Einlesen übergangen.');
  setz(2,0,'In den Spalten Steh, Sitz, Aftershow, Kat 4, AAA, F/F und Foto steht die Anzahl der Personen (leer = 0).');
  setz(3,0,'Die Spalten show und Mailout werden beim Einlesen übergangen.');
  IMPORT_KOPF.forEach((t,i)=>setz(5,i,t));
  const bsp1=['','Mustermann','Anna','anna.mustermann@example.com','2','','','','','','','Rolling Stone','Band · N.N.','Band','Gitarrenkoffer bitte hinterlegen',''];
  const bsp2=['','Beispiel','Ben','ben.beispiel@example.com','','1','','','','1','','','Presse · N.N.','Presse','',''];
  bsp1.forEach((w,i)=>setz(6,i,w));
  bsp2.forEach((w,i)=>setz(7,i,w));

}
function importVorlageHerunterladen(){
  download('Importvorlage_Gaesteliste.csv',importVorlageText(),'text/csv;charset=utf-8');
  Toast.show('Importvorlage heruntergeladen.',{type:'ok'});
}

/* CSV in Zeilen und Felder zerlegen — Trenner (Semikolon, Komma, Tabulator) wird selbst erkannt. */
function csvZerlegen(text){
  const probe=text.slice(0,4000);
  const zaehl=z=>(probe.split(z).length-1);
  let d=';';
  const kand=[[';',zaehl(';')],[',',zaehl(',')],['\t',zaehl('\t')]];
  kand.sort((a,b)=>b[1]-a[1]);
  if(kand[0][1]>0)d=kand[0][0];
  const rows=[];let row=[],feld='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text.charAt(i);
    if(inQ){
      if(c==='"'){if(text.charAt(i+1)==='"'){feld+='"';i++;}else inQ=false;}
      else feld+=c;
    }else if(c==='"'){inQ=true;}
    else if(c===d){row.push(feld);feld='';}
    else if(c==='\n'){row.push(feld);feld='';rows.push(row);row=[];}
    else if(c!=='\r'){feld+=c;}
  }
  row.push(feld);rows.push(row);
  return rows;
}

function poolNachName(name){
  const n=String(name||'').trim();if(!n)return null;
  let gr=null;
  state.gruppen.forEach(x=>{if(!gr&&String(x.name||'').trim().toLowerCase()===n.toLowerCase())gr=x;});
  if(!gr){
    gr={id:uid('gr'),name:n,autoGenehmigen:false,erlaubtePlatzarten:ALLPLATZ(),aftershowErlaubt:true};
    state.gruppen.push(gr);
    if(!state.gruppenKontingente[gr.id])state.gruppenKontingente[gr.id]={std:null,ausnahmen:{}};
  }
  return gr;
}
function einladendeNachName(name,gruppeId){
  const n=String(name||'').trim();if(!n)return null;
  let p=null;
  state.einladende.forEach(x=>{if(!p&&String(x.name||'').trim().toLowerCase()===n.toLowerCase())p=x;});
  if(!p){p={id:uid('p'),name:n,gruppeId:gruppeId||null,stdKontingent:null,ausnahmen:{}};state.einladende.push(p);}
  return p;
}

/* Liest den Text einer CSV-Datei und legt die Gäste in der aktiven Show an. */
function importGaesteAusText(text,sh){
  const rows=csvZerlegen(String(text||'').replace(/^﻿/,''));
  const norm=s=>String(s==null?'':s).trim().toLowerCase();
  let hi=-1;
  for(let i=0;i<rows.length&&i<200;i++){
    const r=rows[i].map(norm);
    if(r.indexOf('name')>=0&&r.indexOf('vorname')>=0){hi=i;break;}
  }
  if(hi<0)return {fehler:'In der Datei steht keine Überschriftenzeile mit „Name“ und „Vorname“. Bitte die Importvorlage verwenden.'};
  const kopf=rows[hi].map(norm);
  const sp=function(){for(let i=0;i<arguments.length;i++){const k=kopf.indexOf(arguments[i]);if(k>=0)return k;}return -1;};
  const iNach=sp('name'),iVor=sp('vorname'),iMail=sp('e-mail','email','mail','e mail');
  const iRef=sp('referenz/medium','referenz','medium'),iCo=sp('c/o','co','einladender','einladende person');
  const iPool=sp('pool (immer auswählen)','pool','gruppe'),iNotiz=sp('notiz','bemerkung','anmerkung');
  const iPlatz={steh:sp('steh'),sitz:sp('sitz'),aftershow:sp('aftershow'),kat4:sp('kat 4','kat4')};
  const iPass={aaa:sp('aaa'),ff:sp('f/f','ff','family & friends'),foto:sp('foto')};
  const zahl=v=>{const n=parseInt(String(v==null?'':v).replace(/[^0-9-]/g,''),10);return (isNaN(n)||n<0)?0:n;};
  const feld=(r,i)=>(i<0||i>=r.length)?'':String(r[i]==null?'':r[i]).trim();
  const vorhanden={};
  state.gaeste.forEach(x=>{if(x.showId===sh.id)vorhanden[((x.nachname||'')+'|'+(x.vorname||'')).toLowerCase()]=true;});
  let neu=0,doppelt=0,leer=0;
  const angelegt=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];
    const nach=feld(r,iNach),vor=feld(r,iVor),mail=feld(r,iMail);
    if(!nach&&!vor&&!mail){leer++;continue;}
    if(!nach&&!vor){leer++;continue;}
    // Summen- und Zwischenzeilen der gewohnten Tabelle nicht als Gast anlegen
    if(/^(total|gesamt|summe)/i.test(nach)){leer++;continue;}
    // Die beiden Beispielzeilen der Vorlage werden uebergangen, falls sie stehen geblieben sind
    if(mail==='anna.mustermann@example.com'||mail==='ben.beispiel@example.com'){leer++;continue;}
    const schl=(nach+'|'+vor).toLowerCase();
    if(vorhanden[schl]){doppelt++;continue;}
    const plaetze=leerePlaetze(),paesse=leerePaesse();
    Object.keys(iPlatz).forEach(k=>{plaetze[k]=zahl(feld(r,iPlatz[k]));});
    Object.keys(iPass).forEach(k=>{paesse[k]=zahl(feld(r,iPass[k]));});
    const gr=poolNachName(feld(r,iPool));
    const pers=einladendeNachName(feld(r,iCo),gr?gr.id:null);
    const g={id:uid('g'),vorname:vor,nachname:nach,email:mail,begleitungen:0,
      plaetze:plaetze,pass:paesse,referenz:feld(r,iRef),
      einladenderId:pers?pers.id:null,gruppeId:gr?gr.id:null,showId:sh.id,
      status:'genehmigt',checkinAt:null,notiz:feld(r,iNotiz),
      aftershow:plaetze.aftershow>0,nachtrag:false,autoGenehmigt:false,mailoutAt:null,createdAt:Date.now()};
    state.gaeste.push(g);angelegt.push(g);
    vorhanden[schl]=true;neu++;
  }
  return {neu:neu,doppelt:doppelt,leer:leer};
}

/* (c) CSV krasserstoff — eine Zeile pro Person */
function exportKrasserstoff(sh){
  if(!guardFinal(sh))return false;
  const guests=finalGuests(sh);
  // Unbenannte Begleitungen erfassen
  const betroffen=[];let unbenannt=0;
  guests.forEach(g=>{
    const missing=g.begleitungen.filter(b=>!b.name||!b.name.trim()).length;
    if(missing){unbenannt+=missing;betroffen.push(guestName(g)+' ('+missing+')');}
  });
  if(unbenannt>0){
    if(!confirm('⚠ '+unbenannt+' Begleitung(en) ohne Namen — bei harter Personalisierung muss jeder Name einzeln aufs Ticket.\nBetroffene Hauptgäste:\n'+betroffen.join(', ')+'\n\nDiese Begleitungen erscheinen NICHT im CSV. Trotzdem exportieren?'))return false;
  }
  const rows=[['Vorname','Nachname']];
  guests.forEach(g=>{
    rows.push([g.vorname||'',g.nachname||'']);
    g.begleitungen.forEach(b=>{
      if(b.name&&b.name.trim()){const p=splitName(b.name);rows.push([p.v,p.n]);}
    });
  });
  download(fname(sh,'krasserstoff','csv'),BOM+csvRows(rows),'text/csv;charset=utf-8');
  return true;
}

/* (d) Aftershow-Liste */
function aftershowGuests(sh){
  return finalGuests(sh).filter(g=>g.aftershow||platzWert(g,'aftershow')>0);
}
function exportAftershowCsv(sh){
  if(!guardFinal(sh))return false;
  const rows=[['Name','Vorname','Personen','Plätze / Ausweise','c/o']];
  aftershowGuests(sh).forEach(g=>rows.push([g.nachname||'',g.vorname||'',String(personsPlanned(g)),
    platzText(g),(pById(g.einladenderId)||{name:''}).name]));
  download(fname(sh,'aftershow','csv'),BOM+csvRows(rows),'text/csv;charset=utf-8');
  return true;
}

/* (a) Druckliste + (d) Aftershow-Druck */
function renderPrintList(sh,aftershow){
  const guests=aftershow?aftershowGuests(sh):finalGuests(sh);
  const persons=guests.reduce((s,g)=>s+personsPlanned(g),0);
  const v=$('view');v.innerHTML='';
  const box=ael('div','printview');
  box.appendChild(ael('h2',null,(aftershow?'AFTERSHOW · ':'')+'Gästeliste '+(sh.stadt||'')));
  const ph=ael('div','phead small');
  ph.textContent=(sh.venue||'')+' · '+fmtDate(sh.datum)+' · Version v'+sh.finalVersion+' · '+
    new Date().toLocaleDateString('de-DE')+' '+hhmm(Date.now())+' · '+guests.length+' Gäste / '+persons+' Personen';
  box.appendChild(ph);
  const tab=ael('table','plist');
  const thead=document.createElement('thead');const tr=document.createElement('tr');
  ['','Name','Vorname','Pers.','Plätze / Ausweise','Pool','c/o','Abhaken / Unterschrift'].forEach(t=>{
    const th=ael('th',null,t);tr.appendChild(th);});
  thead.appendChild(tr);tab.appendChild(thead);
  const tb=document.createElement('tbody');
  guests.forEach(g=>{
    const r=document.createElement('tr');
    const bar=ael('td','bar');bar.style.background=hauptPlatz(g).farbe;r.appendChild(bar);
    r.appendChild(ael('td',null,g.nachname||''));
    r.appendChild(ael('td',null,g.vorname||''));
    r.appendChild(ael('td',null,String(personsPlanned(g))));
    r.appendChild(ael('td',null,platzText(g)));
    r.appendChild(ael('td',null,(grpById(g.gruppeId)||{name:''}).name));
    r.appendChild(ael('td',null,(pById(g.einladenderId)||{name:''}).name));
    r.appendChild(ael('td','sign',''));
    tb.appendChild(r);
  });
  tab.appendChild(tb);box.appendChild(tab);
  const pf=ael('div','small muted pfoot');pf.textContent=tourLabel()+' · Gästeliste · Tourmanagement · '+(sh.stadt||'')+' '+fmtDate(sh.datum);
  box.appendChild(pf);
  v.appendChild(box);
  const back=ael('button','smallbtn','← Zurück zur Verwaltung');back.style.margin='12px 16px';
  back.onclick=()=>render();v.appendChild(back);
  window.print();
}
function exportDruckliste(sh){if(!guardFinal(sh))return false;renderPrintList(sh,false);return true;}
function exportAftershowDruck(sh){if(!guardFinal(sh))return false;renderPrintList(sh,true);return true;}

/* JSON-Export / -Import */
function jsonExport(){
  download('gaesteliste_'+slug(state.kuenstler)+'_gesamt_'+stampNow()+'.json',JSON.stringify(state,null,2),'application/json');
  prefs.lastExportAt=Date.now();prefs.changedSinceExport=false;savePrefs();
  Toast.show('JSON-Export erstellt.',{type:'ok'});
}
function backupReminder(){
  const last=prefs.lastExportAt;
  if(!last||prefs.changedSinceExport!==true)return;
  if(Date.now()-last<=86400000)return;
  Toast.show('Letzte JSON-Sicherung ist über einen Tag her — und es gab seitdem Änderungen.',
    {type:'warn',ms:12000,action:{label:'Jetzt sichern',on:jsonExport}});
}
$('csvImport').onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const sh=aktiveShow();
  if(!sh){alert('Zum Einlesen zuerst eine Show auswählen.');$('csvImport').value='';return;}
  if(sh.final&&!confirm('Die Show ist bereits finalisiert. Eingelesene Gäste wären Nachträge. Trotzdem einlesen?')){$('csvImport').value='';return;}
  const r=new FileReader();
  r.onload=()=>{
    const erg=importGaesteAusText(r.result,sh);
    $('csvImport').value='';
    if(erg.fehler){alert(erg.fehler);return;}
    if(!erg.neu&&!erg.doppelt){alert('In der Datei standen keine Gästezeilen.');return;}
    save();render();
    Toast.show('Eingelesen: '+erg.neu+' Gäste'+(erg.doppelt?', '+erg.doppelt+' schon vorhanden (übersprungen)':'')+'.',{type:'ok'});
  };
  r.onerror=()=>{alert('Datei konnte nicht gelesen werden.');$('csvImport').value='';};
  r.readAsText(f,'UTF-8');

$('fileImport').onchange=e=>{
  const f=e.target.files[0];if(!f){return;}
  const r=new FileReader();
  r.onload=()=>{
    let parsed;
    try{parsed=JSON.parse(r.result);}catch(err){alert('Datei konnte nicht gelesen werden.');$('fileImport').value='';return;}
    const cand=migrate(parsed);
    const nG=cand.gaeste.length,nS=cand.shows.length;
    // Sicherung eines anderen Künstlers landet auch in dessen Arbeitsbereich, nicht im offenen
    const fileArt=(parsed&&isArtist(parsed.kuenstler))?parsed.kuenstler:null;
    const target=fileArt||state.kuenstler;
    const msg=(target!==state.kuenstler)
      ? 'Diese Sicherung gehört zu „'+target+'“.\nIn diesen Arbeitsbereich wechseln und ihn mit '+nG+' Gästen über '+nS+' Shows überschreiben?'
      : 'Arbeitsbereich „'+state.kuenstler+'“ mit '+nG+' Gästen über '+nS+' Shows überschreiben?';
    if(confirm(msg)){
      if(target!==state.kuenstler){
        if(worthSaving())save();
        curArtist=target;prefs.artist=target;savePrefs();
        LS_KEY=wsKey(target);
      }
      cand.kuenstler=target;
      state=cand;save();
      starteMitNaechsterShow();
      resetViewState();applyHeader();render();
      Toast.show('Import übernommen: '+nG+' Gäste, '+nS+' Shows ('+target+').',{type:'ok'});
    }
    $('fileImport').value='';
  };
  r.readAsText(f);
};

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const eur=n=>(Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
function tokensForShow(showId){return (state.tokens||[]).filter(t=>t.showId===showId);}
function tkMap(sh){return sh?seatmapForShow(sh.stadt,sh.venue):null;}
function tkKatName(sm,id){if(!sm)return id;const k=(sm.kategorien||[]).find(x=>x.id===id);return k?k.name:id;}
function tkPlatzLabel(p,sm){
  if(!p)return '';

  return (p.block||'')+' · Reihe '+p.reihe+' · Sitz '+p.sitz;

function tkPlaetzeText(t,sm){
  if(!t.ausgewaehltePlaetze||!t.ausgewaehltePlaetze.length)return '–';

function tkLink(t){
  // gleicher Ordner wie gaesteliste.html
  const base=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');

function tkCreateToken(gast,opts,still){
  const now=Date.now();
  const t={
    id:'tk'+now+Math.floor(Math.random()*1e5),
    gastRef:gast.id,email:opts.email||'',showId:gast.showId,
    modus:opts.modus||'kontingent',
    maxPlaetze:Math.min(4,Math.max(1,opts.maxPlaetze||1)),
    kategorieRahmen:opts.kategorieRahmen||null,
    status:'offen',
    ausgewaehltePlaetze:[],
    createdAt:now,redeemedAt:null,updatedAt:now
  };
  if(!Array.isArray(state.tokens))state.tokens=[];
  state.tokens.push(t);
  if(still)return t;          // Sammel-Anlage speichert und zeichnet erst am Ende
  save();render();return t;
}

function exportMailout(sh){
  if(!sh){Toast.show('Keine Show gewählt.',{type:'warn'});return false;}
  const tks=tokensForShow(sh.id).filter(t=>t.status!=='widerrufen');
  const rows=[['Name','Vorname','E-Mail','Plätze','Pool','c/o','Ticket-Link','Mailout']];
  let n=0;
  tks.forEach(t=>{
    const g=state.gaeste.find(x=>x.id===t.gastRef);
    if(!g)return;
    rows.push([g.nachname||'',g.vorname||'',t.email||g.email||'',String(t.maxPlaetze||1),
      (grpById(g.gruppeId)||{name:''}).name,(pById(g.einladenderId)||{name:''}).name,
      tkLink(t),g.mailoutAt?'versendet':'offen']);
    n++;
  });
  if(!n){Toast.show('Noch keine Ticket-Zugänge für diese Show.',{type:'info'});return false;}
  download(fname(sh,'mailout','csv'),BOM+csvRows(rows),'text/csv;charset=utf-8');
  Toast.show(n+' Zeilen in der Mailout-Liste.',{type:'ok'});
  return true;
}

function tkExportJson(showId){
  const sh=showById(showId);
  const tks=tokensForShow(showId);
  if(!tks.length){Toast.show('Keine Ticket-Zugänge zum Exportieren.',{type:'info'});return;}
  // shows-Block additiv, damit gast.html am Zweitgerät (ohne localStorage) Show/Venue kennt.
  // TM-Import liest ausschließlich tokens; shows wird dort ignoriert.
  const payload={schema:1,kuenstler:state.kuenstler,tokens:deepCopy(tks),
    shows:sh?[{id:sh.id,stadt:sh.stadt,venue:sh.venue,datum:sh.datum}]:[]};
  download('ticketzugang_'+slug(state.kuenstler)+'_'+slug(sh?sh.stadt:'show')+'_'+stampNow()+'.json',JSON.stringify(payload,null,2),'application/json');
}
$('tokenImport').onchange=e=>{
  const f=e.target.files[0];if(!f){return;}
  const r=new FileReader();
  r.onload=()=>{
    let parsed;
    try{parsed=JSON.parse(r.result);}catch(err){alert('Datei konnte nicht gelesen werden.');$('tokenImport').value='';return;}
    const inc=parsed&&Array.isArray(parsed.tokens)?parsed.tokens:(Array.isArray(parsed)?parsed:null);
    if(!inc){alert('Keine Token in der Datei gefunden.');$('tokenImport').value='';return;}
    if(!Array.isArray(state.tokens))state.tokens=[];
    let upd=0,unbk=0;
    inc.forEach(it=>{
      if(!it||!it.id)return;
      const cur=state.tokens.find(x=>x.id===it.id);
      if(!cur){unbk++;return;} // unbekannte Token nicht einschleusen (TM kennt sie nicht)
      // Aus Antwort-Datei NUR gast-veränderliche Felder übernehmen, TM-eigene nie überschreiben
      const gf={};['status','ausgewaehltePlaetze','redeemedAt','updatedAt'].forEach(k=>{if(it[k]!==undefined)gf[k]=it[k];});
      const beforeStatus=cur.status,beforeUpd=cur.updatedAt;
      mergeToken(cur,gf);
      if(cur.status!==beforeStatus||cur.updatedAt!==beforeUpd)upd++;
    });
    save();render();
    Toast.show('Token-Import: '+upd+' aktualisiert'+(unbk?', '+unbk+' unbekannte übersprungen':'')+'.',{type:'ok'});
    $('tokenImport').value='';
  };
  r.readAsText(f);
};

    const d1=ael('div');d1.id='setDisplay';d1.style.margin='6px 0 4px';
    // F4.2 Theme
    const themeLbl=ael('div','small muted','Theme');themeLbl.style.marginBottom='3px';d1.appendChild(themeLbl);
    const themeRow=ael('div','seg');themeRow.style.marginBottom='10px';
    const setThemeBtn=(val,lab)=>{const b=ael('button',(prefs.theme||'light')===val?'on':null,lab);b.type='button';
      b.onclick=()=>{prefs.theme=val;savePrefs();applyTheme();themeRow.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
      themeRow.appendChild(b);};
    setThemeBtn('dark','Dunkel');setThemeBtn('light','Hell');
    d1.appendChild(themeRow);
    // F4.3 Schriftgroesse
    const fsLbl=ael('div','small muted','Schriftgröße');fsLbl.style.marginBottom='3px';d1.appendChild(fsLbl);
    const fsRow=ael('div','seg');
    const setFsBtn=(val,lab)=>{const b=ael('button',(prefs.fontSize||'m')===val?'on':null,lab);b.type='button';
      b.onclick=()=>{prefs.fontSize=val;savePrefs();applyFontSize();fsRow.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
      fsRow.appendChild(b);};
    setFsBtn('s','S');setFsBtn('m','M');setFsBtn('l','L');
    d1.appendChild(fsRow);
    s1.appendChild(d1);dlg.appendChild(s1);
    // Bedienung — Platzhalter
    const s2=ael('div');s2.style.marginTop='12px';s2.appendChild(ael('div','kicker','Bedienung'));
    const d2=ael('div');d2.id='setBedienung';d2.style.margin='6px 0 4px';
    // F4.5 Einfach/Profi-Umschalter
    const modeRow=ael('div','seg');modeRow.style.marginBottom='8px';
    const setModeBtn=(val,lab)=>{const b=ael('button',(prefs.mode||'profi')===val?'on':null,lab);b.type='button';
      b.onclick=()=>{prefs.mode=val;savePrefs();applyEinfachMode();modeRow.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render();};
      modeRow.appendChild(b);};
    setModeBtn('einfach','Einfach');setModeBtn('profi','Profi');
    d2.appendChild(modeRow);
    d2.appendChild(ael('div','small muted','Einfach blendet Fortgeschrittenes aus (Kontingent-Matrix, JSON-/Token-Import). Anlegen, Freigabe, Finalisierung, Exporte und Einlass bleiben immer sichtbar.'));
    // F5.1 „Am Handy öffnen"-QR
    const qrBtn=ael('button','smallbtn');qrBtn.style.marginTop='8px';
    (function(){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','icon tlbicon');svg.setAttribute('aria-hidden','true');const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#icon-qr');svg.appendChild(use);qrBtn.appendChild(svg);})();
    qrBtn.appendChild(document.createTextNode('Am Handy öffnen (QR)'));
    qrBtn.onclick=()=>{close();openQrDlg('Am Handy öffnen',currentToolUrl(),'Diese Ansicht am Smartphone öffnen — QR scannen.');};
    d2.appendChild(qrBtn);
    const tourBtn=ael('button','smallbtn','Kurz-Tour erneut starten');tourBtn.style.marginTop='8px';
    tourBtn.onclick=()=>{close();openTourDlg();};
    d2.appendChild(tourBtn);
    const anlBtn=ael('button','smallbtn','Bedienungsanleitung öffnen');anlBtn.style.marginTop='8px';
    anlBtn.onclick=()=>{window.open('Bedienungsanleitung.html','_blank','noopener');};
    d2.appendChild(anlBtn);
    s2.appendChild(d2);dlg.appendChild(s2);
    // Daten
    const s3=ael('div');s3.style.marginTop='12px';s3.appendChild(ael('div','kicker','Daten'));
    const d3=ael('div');d3.id='setDaten';d3.style.cssText='margin:6px 0 4px;display:flex;flex-wrap:wrap;gap:8px';
    const demoBtn=ael('button','smallbtn no','Demo-Daten entfernen');
    demoBtn.disabled=!demoDataPresent();
    if(demoBtn.disabled)demoBtn.title='Keine Demo-Daten vorhanden.';
    demoBtn.onclick=()=>{removeDemoData();close();};
    const expBtn=ael('button','smallbtn','JSON-Export');expBtn.onclick=()=>{close();jsonExport();};
    const impBtn=ael('button','smallbtn einfach-hide','JSON-Import');impBtn.onclick=()=>{close();$('fileImport').click();};
    d3.appendChild(demoBtn);d3.appendChild(expBtn);d3.appendChild(impBtn);
    s3.appendChild(d3);
    s3.appendChild(ael('div','small muted','Sicherung: Stände als JSON exportieren bzw. importieren.'));
    dlg.appendChild(s3);
    const btns=ael('div','dlgbtns');
    const cl=ael('button',null,'Schließen');cl.onclick=close;btns.appendChild(cl);
    dlg.appendChild(btns);
  });
}

/* ================= F4.5 Einfach/Profi-Modus ================= */
function applyEinfachMode(){document.body.classList.toggle('mode-einfach',prefs.mode==='einfach');}

/* ================= F4.2 Theme (Dark/Light) ================= */
function applyTheme(){
  const t=prefs.theme==='light'?'light':'dark';
  if(t==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
}

/* ================= F4.3 Schriftgröße S/M/L ================= */
function applyFontSize(){
  const map={s:15/16,m:1,l:18/16};
  const f=map[prefs.fontSize]||1;
  document.documentElement.style.setProperty('--zoom',String(f));
}

/* ================= F5.1/F6.8 QR-Dialog ================= */
function openQrDlg(title,text,subtitle){
  modal((dlg,close)=>{
    dlg.appendChild(ael('h2',null,title||'QR-Code'));
    if(subtitle){const s=ael('div','small muted');s.style.marginBottom='8px';s.textContent=subtitle;dlg.appendChild(s);}
    const box=ael('div','qrbox');
    const frame=ael('div','qrframe');
    let ok=false;
    try{
      if(window.QR&&typeof window.QR.svg==='function'){
        const svg=window.QR.svg(text,{size:220,margin:4,dark:'#17181C',light:'#ffffff'});
        if(svg){frame.innerHTML=svg;ok=true;}
      }
    }catch(e){ok=false;}
    if(ok){box.appendChild(frame);}
    else{box.appendChild(mkHint('QR-Code nicht verfügbar — bitte den Link verwenden.'));}
    const lk=ael('div','qrlink');lk.textContent=text;box.appendChild(lk);
    dlg.appendChild(box);
    const btns=ael('div','dlgbtns');const c=ael('button','save','Schließen');c.onclick=close;btns.appendChild(c);dlg.appendChild(btns);
  });
}
function currentToolUrl(){return location.href.replace(/[?#].*$/,'');}

/* ================= F1.4 Kurz-Tour ================= */
function tourSteps(){
  return [
    {t:'Künstler / Band',x:'Ganz oben im Tab „Verwaltung“ den Act wählen — alle von Landstreicher Booking vertretenen Künstler und Bands, alphabetisch, mit Sofortsuche. Jeder hat eigene Shows, Gäste und Kontingente.'},
    {t:'Verwaltung',x:'Shows anlegen, Deckel/Deadline/Kontingente pflegen, Gästeliste finalisieren und exportieren.'},
    {t:'Einladen',x:'Die c/o-Personen stellen hier Gast-Anfragen — mit Kontingent-Anzeige und Status (angefragt/genehmigt/final).'},
    {t:'Einlass',x:'An der Abendkasse: schnell nach Namen suchen und einchecken, auch für Begleitungen.'},
    {t:'Ticket',x:'Ticket-Zugänge (Demo) für externe Gäste ausgeben — per Link, Mail oder QR-Code.'},
    {t:'Export',x:'Ganz unten in der Werkzeugleiste: Exporte, JSON-Sicherung und Drucken — von jedem Tab aus erreichbar.'}
  ];
}
function openTourDlg(){
  const steps=tourSteps();let idx=0;
  modal((dlg,close)=>{
    const h2=ael('h2',null,'');dlg.appendChild(h2);
    const body=ael('div');body.style.marginBottom='12px';dlg.appendChild(body);
    const btns=ael('div','dlgbtns');dlg.appendChild(btns);
    function draw(){
      h2.textContent='Kurz-Tour ('+(idx+1)+'/'+steps.length+') · '+steps[idx].t;
      body.textContent=steps[idx].x;
      btns.innerHTML='';
      if(idx>0){const b=ael('button',null,'Zurück');b.onclick=()=>{idx--;draw();};btns.appendChild(b);}
      const skip=ael('button',null,'Überspringen');skip.onclick=close;btns.appendChild(skip);
      const next=ael('button','save',idx<steps.length-1?'Weiter':'Fertig');
      next.onclick=()=>{if(idx<steps.length-1){idx++;draw();}else close();};
      btns.appendChild(next);
    }
    draw();
  });
}

/* ================= F2.6 Tastatur-Shortcuts (Desktop) ================= */
function focusSearch(){
  const el=document.querySelector('.glsearch input,.searchbar input,#view input[type=search]');
  if(el){el.focus();if(el.select)el.select();}
}
function openShortcutHelp(){
  modal((dlg,close)=>{
    dlg.appendChild(ael('h2',null,'Tastatur-Kürzel'));
    const ul=ael('ul','schelp');
    [['/','Suche fokussieren'],['n','Neuen Gast anlegen'],['1 – 4','Tab wechseln (Verwaltung/Einladen/Einlass/Ticket)'],['Esc','Offenen Dialog schließen'],['?','Diese Hilfe anzeigen']]
      .forEach(([k,d])=>{const li=ael('li');li.appendChild(ael('kbd',null,k));li.appendChild(ael('span',null,d));ul.appendChild(li);});
    dlg.appendChild(ul);
    const btns=ael('div','dlgbtns');const c=ael('button','save','Schließen');c.onclick=close;btns.appendChild(c);dlg.appendChild(btns);
  });
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const ae=document.activeElement;
  if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
  const openDlg=document.querySelector('dialog[open]');
  if(e.key==='Escape'){if(openDlg)openDlg.close();return;}
  if(openDlg)return;
  const k=e.key;
  if(k==='/'){e.preventDefault();focusSearch();}
  else if(k==='n'||k==='N'){e.preventDefault();openGuestDlg(null,{});}
  else if(k>='1'&&k<='4'){e.preventDefault();setModus(['verwaltung','einladen','einlass','ticket'][+k-1]);}
  else if(k==='?'){e.preventDefault();openShortcutHelp();}
});

/* ================= Start ================= */
function init(){
  loadPrefs();
  if(!isArtist(prefs.artist))prefs.artist=ARTIST_DEFAULT;
  curArtist=prefs.artist;
  LS_KEY=wsKey(curArtist);
  load();
  starteMitNaechsterShow();
  applyHeader();
  const gb=$('gearBtn');if(gb)gb.onclick=openSettingsDlg;
  applyEinfachMode();
  applyTheme();
  applyFontSize();
  // savedAt-Anzeige initialisieren
  if(state.meta&&state.meta.savedAt){
    const d=new Date(state.meta.savedAt);
    $('savedAt').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  render();
  backupReminder();
  if(!prefs.tourSeen){prefs.tourSeen=true;savePrefs();setTimeout(openTourDlg,300);}
}
init();
</script>
